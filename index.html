const ONDERTEKENAAR = "Ramlal Anshul";
/* Het adres staat op twee plekken op de factuur: in de kop en in het bankblok. */
const TTG_ADRES = "Parijsstraat 40";

const BANKEN = {
  USD: { naam:"Republic Bank N.V. (RBC)", adres:"Kerkplein 1 - Paramaribo - Suriname",
         swift:"RBNKSRPA", rekening:"Account number for USD  0197-244-595" },
  SRD: { naam:"De Surinaamsche Bank N.V.", adres:"Henk Arron Straat 26 - 30 - Paramaribo - Suriname",
         swift:"SURBSRPA", rekening:"Account number for SRD  3907619" },
};
/* EUR is voor familie die contant betaalt — daar hoort geen bankblok bij,
   maar een regel dat het contant wordt afgerekend. Zie invoicePrint(). */
/* Eén plek waar een valuta wordt vastgesteld. Doe dit nergens anders opnieuw met de hand,
   anders vergeet je bij een nieuwe munt een plek — precies wat er met EUR gebeurde. */
const normValuta = v => (v === "USD" ? "USD" : v === "EUR" ? "EUR" : "SRD");
const invValuta = iv => normValuta(iv.valuta);
const invBedrag = (iv, v, d) => invValuta(iv) + " " + nf(v, d == null ? (invValuta(iv)==="SRD" ? 0 : 2) : d);

function invoiceTotalen(iv){
  const regels  = (iv.items||[]).reduce((a,i) => a + N(i.aantal != null ? i.aantal : i.bus) * N(i.prijs), 0);
  /* Bankkosten gelden alleen bij een internationale overboeking, dus alleen op een USD-factuur.
     Bij SRD betaalt de klant lokaal en bij EUR contant — dan telt die regel niet mee. */
  const bankFee = invValuta(iv) === "USD" ? N(iv.bankFeeAantal) * N(iv.bankFeePrijs) : 0;
  const sub     = cent(regels + bankFee);
  const btw     = iv.metBtw ? cent(sub * N(iv.btwPct) / 100) : 0;
  const subInc  = cent(sub + btw);
  const credit  = N(iv.credit != null ? iv.credit : iv.deposit);
  return { regels, bankFee, sub, btw, subInc, credit, balance: cent(subInc - credit) };
}

/* Nummeren doe je zelf. De app telt alleen op vanaf je laatste factuur:
   staat er 20260-05, dan stelt hij 20260-06 voor. Je kunt het altijd overtypen. */
function volgendInvoiceNummer(){
  const laatste = S.invoices.slice()
    .sort((a,b) => (a.datum||"").localeCompare(b.datum||"") || String(a.id).localeCompare(String(b.id)))
    .reverse()
    .map(x => String(x.nummer || "").trim())
    .find(n => /\d\s*$/.test(n));
  if(!laatste) return "";
  const m = /^(.*?)(\d+)(\D*)$/.exec(laatste);
  if(!m) return "";
  const cijfers = String(Number(m[2]) + 1).padStart(m[2].length, "0");
  return m[1] + cijfers + m[3];
}

function viewInvoices(){
  if(printId) return invoicePrint(S.invoices.find(i => i.id === printId));
  return card("Invoice & Offerte",
    `Elke factuur wordt ondertekend met <b>${ONDERTEKENAAR}</b> en je eigen handtekening, naast het rode stempel.`,
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Type</th><th>Nummer</th><th>Datum</th><th>Aan</th><th>Betreft</th>
        <th class="text-right">Totaal incl.</th><th class="text-right">Openstaand</th><th></th></tr></thead>
      <tbody>${S.invoices.slice().sort((a,b)=>(b.datum||"").localeCompare(a.datum||"") || String(b.id).localeCompare(String(a.id))).map(iv => {
        const t = invoiceTotalen(iv);
        return `<tr>
          <td><span class="pill ${iv.type==="Offerte"?"bg-amber-100 text-amber-800":"bg-emerald-100 text-emerald-800"}">${esc(iv.type)}</span></td>
          <td class="font-bold">${esc(iv.nummer)}</td><td>${dmy(iv.datum)}</td><td>${esc(iv.aan)}</td><td>${esc(iv.betreft||"")}</td>
          <td class="text-right">${invBedrag(iv, t.subInc)}</td>
          <td class="text-right font-bold">${invBedrag(iv, t.balance)}</td>
          <td class="whitespace-nowrap">
            <button class="text-emerald-700 font-bold text-xs" data-act="inv-bewerk" data-id="${iv.id}">bewerken</button> ·
            <button class="text-emerald-700 font-bold text-xs" data-act="inv-print" data-id="${iv.id}">print</button> ·
            <button class="text-red-600 font-bold text-xs" data-act="inv-wis" data-id="${iv.id}">wis</button></td>
        </tr>`;
      }).join("")}</tbody></table></div>`,
    knop("inv-nieuw","+ Nieuwe invoice/offerte"));
}

function invoiceModal(iv, isNieuw){
  const regels = (iv.items && iv.items.length ? iv.items : [{oms:"",period:"",aantal:1,prijs:0}]);
  const valuta = invValuta(iv);
  const metBtw = isNieuw ? false : !!iv.metBtw;
  const velden = [

let maandJaar = null;
function viewMaandoverzicht(){
  const alleMaanden = Array.from(new Set(
    [].concat(S.ritten, S.brandstof, S.schoonmaak, S.onderhoud, S.serviceBeurten)
      .map(x => ym(x.datum)).filter(Boolean)
  )).sort();
  const jaren = Array.from(new Set(alleMaanden.map(m => m.slice(0,4)))).sort().reverse();
  if(!jaren.length) jaren.push(todayISO().slice(0,4));
  const jaar = (maandJaar && jaren.includes(maandJaar)) ? maandJaar : (jaren.includes(todayISO().slice(0,4)) ? todayISO().slice(0,4) : jaren[0]);
  const maanden = alleMaanden.filter(m => m.startsWith(jaar));

  const totaal = { ritten:0, omzet:0, chauffeurs:0, brandstof:0, schoonmaak:0, onderhoud:0, service:0, verzekering:0, keuring:0, kosten:0, netto:0 };
  const rijen = maanden.map(m => {
    const c = maandCijfers(m);
    Object.keys(totaal).forEach(k => totaal[k] += c[k]);
    return `<tr><td class="font-bold">${MAAND[N(m.slice(5,7))-1]}</td><td class="text-right">${c.ritten}</td>
      <td class="text-right">${nf(c.omzet)}</td><td class="text-right">${nf(c.chauffeurs)}</td>
      <td class="text-right">${nf(c.brandstof)}</td><td class="text-right">${nf(c.schoonmaak)}</td>
      <td class="text-right">${nf(c.onderhoud)}</td><td class="text-right">${nf(c.service)}</td>
      <td class="text-right">${nf(c.verzekering + c.keuring)}</td>
      <td class="text-right text-red-700">${nf(c.kosten)}</td>
      <td class="text-right font-black ${c.netto>=0?"text-emerald-800":"text-red-700"}">${nf(c.netto)}</td></tr>`;
  }).join("");

  return card(`Maandoverzicht ${jaar}`,
    "Alle kosten en opbrengsten per maand. Verzekering en keuring worden per maand toegerekend (jaarbedrag ÷ 12). Kies bovenaan een ander jaar.",
    `<div class="p-3 flex gap-2 flex-wrap border-b border-slate-100">
       ${jaren.map(j => `<button class="btn ${j===jaar?"btn-y":"btn-w"}" data-act="maand-jaar" data-j="${j}">${j}</button>`).join("")}
     </div>
     <div class="scroll"><table class="tbl">
      <thead><tr><th>Maand</th><th class="text-right">Ritten</th><th class="text-right">Omzet</th><th class="text-right">Chauffeurs</th>
        <th class="text-right">Brandstof</th><th class="text-right">Schoonmaak</th><th class="text-right">Onderhoud</th>
        <th class="text-right">Service</th><th class="text-right">Verz.+keur.</th><th class="text-right">Kosten</th><th class="text-right">Netto</th></tr></thead>
      <tbody>${rijen || `<tr><td colspan="11" class="text-center text-slate-500 py-6">Nog niets ingevoerd in ${jaar}.</td></tr>`}</tbody>
      ${maanden.length ? `<tfoot><tr class="bg-emerald-50">
        <td class="font-black">Totaal ${jaar}</td><td class="text-right font-bold">${totaal.ritten}</td>
        <td class="text-right font-bold">${nf(totaal.omzet)}</td><td class="text-right font-bold">${nf(totaal.chauffeurs)}</td>
        <td class="text-right font-bold">${nf(totaal.brandstof)}</td><td class="text-right font-bold">${nf(totaal.schoonmaak)}</td>
        <td class="text-right font-bold">${nf(totaal.onderhoud)}</td><td class="text-right font-bold">${nf(totaal.service)}</td>
        <td class="text-right font-bold">${nf(totaal.verzekering + totaal.keuring)}</td>
        <td class="text-right font-black text-red-700">${nf(totaal.kosten)}</td>
        <td class="text-right font-black ${totaal.netto>=0?"text-emerald-800":"text-red-700"}">${nf(totaal.netto)}</td></tr></tfoot>` : ""}
     </table></div>`);
}

   Bus terugverdienen
   ============================================================ */
function viewTerugverdienen(){
  return card("Bus terugverdienen", "Wat een bus tot nu toe netto heeft opgebracht, afgezet tegen de aankoopprijs.",
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Bus</th><th class="text-right">Aankoop SRD</th><th class="text-right">Netto tot nu</th>
        <th class="text-right">Nog te gaan</th><th style="min-width:180px">Voortgang</th></tr></thead>
      <tbody>${S.buses.map(b => {
        const aankoop = N(b.aankoopUsd) * N(A().fxUsd);
        const omzet = S.ritten.filter(r=>r.bus===b.naam).reduce((a,r)=>a+N(r.tariefSrd),0);
        const kost = S.ritten.filter(r=>r.bus===b.naam).reduce((a,r)=>a+N(r.chauffeurPay),0)
                   + S.brandstof.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.totaal),0)
                   + S.schoonmaak.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.kosten),0)
                   + S.onderhoud.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.kosten),0)
                   + S.serviceBeurten.filter(x=>x.bus===b.naam && x.status==="Geserviced").reduce((a,x)=>a+N(x.kosten),0);
        const netto = omzet - kost;
        const pct = aankoop > 0 ? Math.max(0, Math.min(100, netto/aankoop*100)) : 0;
        return `<tr><td class="font-bold">${esc(b.naam)}</td><td class="text-right">${nf(aankoop)}</td>
          <td class="text-right ${netto>=0?"text-emerald-800":"text-red-700"}">${nf(netto)}</td>
          <td class="text-right">${nf(Math.max(0, aankoop-netto))}</td>
          <td><div class="bg-slate-200 rounded-full h-3 overflow-hidden"><div class="bg-emerald-600 h-3" style="width:${pct}%"></div></div>
              <div class="text-[11px] text-slate-500 mt-0.5">${nf(pct,1)}%</div></td></tr>`;
      }).join("")}</tbody></table></div>`);
}

/* ============================================================
   Calculator — rack-tarief per bus
   De rekenketen komt letterlijk uit de oude app; de invoer komt
   nu uit Zonetarieven, zodat hij met je huidige prijzen rekent.
   ============================================================ */
const CALC = { bus:"", bestemming:"", km:55, chauffeur:"", nachten:0, heleDag:false };

/* kosten per km voor één klasse */
function calcPerKm(c, a){
  const jaarVast = N(c.purchaseUsd) * N(a.fxUsd) / Math.max(N(a.years),1) + N(c.insurance) + N(c.keuring);
  return {
    jaarVast,
    fixedKm:   jaarVast / Math.max(N(a.avgKmYr), 1),
    fuelKm:    (c.brandstof === "diesel" ? N(a.diesel) : N(a.petrol)) / Math.max(N(c.verbruik), 0.1),
    serviceKm: N(c.serviceCost) / Math.max(N(c.interval), 1),
  };
}

/* opslagfactor voor de simpele formule */
function calcFactor(c, a){
  if(N(c.factor) > 0) return N(c.factor);
  const t = norm(c.naam || "");
  if(/sedan|minivan|noah|voxy/.test(t))  return 1.5;
  if(/minibus|hiace|pitbull/.test(t))    return 1.8;
  if(/coaster/.test(t))                  return 2;
  return N(a.simpelFactor) || 1.5;
}

/* de hele keten; enkeleKm = afstand heen, wordt × heen-en-terug gerekend */
function rekenTarief(c, a, enkeleKm, nachten, chauffeurskosten, heleDag){
  const d  = calcPerKm(c, a);
  const km = N(enkeleKm) * Math.max(N(a.roundTrip), 1);
  const chauffeur = N(chauffeurskosten === null || chauffeurskosten === "" || chauffeurskosten === undefined
                      ? a.driverFee : chauffeurskosten);
  const benzine   = d.fuelKm * km;
  const overnight = N(nachten) * (N(a.overnightStay) + N(a.overnightFood));
  /* hele dag: de bus en de chauffeur staan de hele dag vast, dat kost meer dan alleen de km */
  const dagdeel   = heleDag ? N(c.dagVergoeding) : 0;
  const afronden  = Math.max(N(a.roundTo), 1);

  if(a.prijsFormule === "simpel"){
    const factor = calcFactor(c, a);
    const vast   = chauffeur + benzine + overnight + dagdeel;
    const net    = vast * factor;
    const rack   = Math.round(net / afronden) * afronden;
    return { simpel:true, factor, km, afschrijving:0, chauffeur, benzine, service:0, overnight, dagdeel,
             vast, onvoorzien:0, wasbeurt:0, onderhoud:0, totaalKost:vast, winst:rack - vast,
             belasting:0, net, rack, rackUsd:rack / N(a.fxUsd), rackEur:rack / N(a.fxEur), d };
  }

  const afschrijving = d.fixedKm   * km;
  const service      = d.serviceKm * km;
  const vast         = afschrijving + chauffeur + benzine + service + overnight + dagdeel;
  const onvoorzien   = vast * N(a.onvoorzienPct) / 100;
  const onderhoud    = vast * N(a.onderhoudPct)  / 100;
  const wasbeurt     = N(a.wash);
  const totaalKost   = vast + onvoorzien + wasbeurt + onderhoud;
  const winst        = totaalKost * N(a.winstPct)     / 100;
  const belasting    = totaalKost * N(a.belastingPct) / 100;
  const net          = totaalKost + winst + belasting;
  const metCommissie = net / (1 - N(a.commissiePct) / 100);
  const rack         = Math.round(metCommissie / afronden) * afronden;
  return { simpel:false, factor:0, km, afschrijving, chauffeur, benzine, service, overnight, dagdeel, vast,
           onvoorzien, wasbeurt, onderhoud, totaalKost, winst, belasting, net:metCommissie,
           rack, rackUsd:rack / N(a.fxUsd), rackEur:rack / N(a.fxEur), d };
}

/* km, chauffeurskosten en nachten overnemen uit Zonetarieven */
function calcVulAan(){
  const kl = klasseVanBus(CALC.bus);
  if(!kl || !CALC.bestemming) return;
  const t = tariefVan(CALC.bestemming, kl);
  if(t.km !== "" && t.km != null) CALC.km = N(t.km);
  CALC.chauffeur = (t.pay === "" || t.pay == null) ? "" : N(t.pay);
  const m = /(\d+)\s*(dag|day)/i.exec(CALC.bestemming || "");
  CALC.nachten = m ? Math.max(0, N(m[1]) - 1) : 0;
}

function calcZet(veld, waarde){
  CALC[veld] = waarde;
  if(veld === "bus" || veld === "bestemming"){ calcVulAan(); render(); }
  else if(veld === "heleDag"){ render(); }
  else calcHertoon();
}

/* alleen de twee rekenblokken opnieuw tekenen, zodat je cursor in het veld blijft staan */
function calcHertoon(){
  const basis = $("#calc-basis"), uit = $("#calc-uitkomst");
  if(basis) basis.innerHTML   = calcBasisHtml();
  if(uit)   uit.innerHTML     = calcUitkomstHtml();
}

function calcKlasse(){
  const kl = klasseVanBus(CALC.bus);
  return S.classes.find(c => c.key === kl) || S.classes[0] || null;
}

function calcBasisHtml(){
  const c = calcKlasse(); const a = A();
  if(!c) return `<div class="px-3 py-2 text-sm text-red-700">Kies een bus met een gekoppelde klasse.</div>`;
  const r = rekenTarief(c, a, CALC.km, CALC.nachten, CALC.chauffeur, CALC.heleDag);
  const rij = (l, v) => `<div class="flex justify-between px-3 py-1.5 border-b border-slate-100 last:border-0">
      <span class="text-slate-500">${l}</span><span class="font-bold text-emerald-800">${v}</span></div>`;
  return rij("Klasse", esc(c.naam))
       + rij("Vaste kosten per km (SRD)", nf(r.d.fixedKm, 2))
       + rij(`${c.brandstof === "diesel" ? "Diesel" : "Benzine"} per km (SRD)`, nf(r.d.fuelKm, 2)
              + ` <span class="font-normal text-slate-400">· ${nf(c.brandstof === "diesel" ? A().diesel : A().petrol, 2)}/l</span>`)
       + rij("Service per km (SRD)",      nf(r.d.serviceKm, 2))
       + rij(`Km heen en terug (× ${nf(Math.max(N(a.roundTrip),1))})`, nf(r.km))
       + rij("Plaatsen in de bus", esc(c.seats));
}

function calcUitkomstHtml(){
  const c = calcKlasse(); const a = A();
  if(!c) return `<div class="p-5 text-sm text-red-700">Kies eerst een bus.</div>`;
  const r  = rekenTarief(c, a, CALC.km, CALC.nachten, CALC.chauffeur, CALC.heleDag);
  const kl = klasseVanBus(CALC.bus);
  const t  = (CALC.bestemming && kl) ? tariefVan(CALC.bestemming, kl) : null;

  const rij = (l, v, dik, grijs) => `<div class="flex justify-between items-center py-1.5 px-4
      ${dik ? "bg-emerald-50 font-black border-y border-emerald-100 text-emerald-900" : (grijs ? "text-slate-500" : "text-slate-700")}">

function herstelBackup(bestand){
  if(!bestand) return;
  if(!confirm("Weet je het zeker? Alle huidige gegevens worden vervangen door de back-up.")) return;
  const lezer = new FileReader();
  lezer.onload = () => {
    try {
      const d = JSON.parse(lezer.result);
      mut("back-up teruggezet");
      S = vulAan((d && d.versie === 4) ? d : migreer(d));
      pasCorrectiesToe(S); ruimBestemmingenOp(S); corrigeerKm(S); ruimRitBestemmingenOp(S); corrigeerBrandstof(S); corrigeerVerbruik(S); nieuweBrandstofPrijs(S);
      logMut("teruggezet", "back-up", bestand.name);
      bewaar(); render();
      alert("Back-up teruggezet.");
    } catch(e) { alert("Dit bestand kon ik niet lezen."); }
  };
  lezer.readAsText(bestand);
}
