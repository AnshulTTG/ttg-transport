<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TTG — The Guianas Transport &amp; Logistics</title>
<meta name="robots" content="noindex" />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin:0; padding:0; }
  body { background:#052e1b; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .inp { background:#fefce8; border:1px solid #d6d3d1; border-radius:6px; padding:4px 8px; width:100%; font-size:13px; color:#0f172a; }
  .inp:focus { outline:2px solid #f59e0b; outline-offset:-1px; }
  .inp[readonly], .inp:disabled { background:#f1f5f9; color:#475569; }
  .btn { border-radius:8px; font-weight:700; font-size:13px; padding:7px 14px; display:inline-flex; align-items:center; gap:6px; }
  .btn-y { background:#f0b429; color:#0b3d24; }
  .btn-y:hover { background:#e0a51f; }
  .btn-w { background:rgba(255,255,255,.9); color:#052e1b; }
  .btn-r { background:#dc2626; color:#fff; }
  .btn-g { background:#065f46; color:#fff; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th { background:#0b3d24; color:#fff; text-align:left; padding:8px 10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  table.tbl td { border-bottom:1px solid #e2e8f0; padding:6px 10px; vertical-align:middle; }
  table.tbl tr:nth-child(even) td { background:#f8fafc; }
  .card { background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); overflow:hidden; }
  .card-h { background:#0b3d24; color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card-n { background:#ecfdf5; color:#065f46; font-size:12px; padding:8px 16px; border-bottom:1px solid #d1fae5; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; display:inline-block; }
  .scroll { overflow-x:auto; }
  .auto-row td { background:#f1f5f9 !important; color:#475569; font-style:italic; }
  @media print {
    @page { margin:10mm; }
    html, body { background:#fff !important; }
    /* Alles wat niet de factuur is krijgt de klasse prt-verberg en gaat weg.
       display:none en niet visibility:hidden — anders blijft de hoogte staan
       en krijg je een lege tweede pagina.
       Let op: hang géén regels aan de positie van elementen (#app > div > *:not(main)),
       want dan breekt het printen zodra de indeling verandert. */
    .prt-verberg, #app header, #app aside, #app nav, #modal-laag { display:none !important; }
    #app > div { min-height:0 !important; background:none !important; padding:0 !important; }
    /* de rij met zijbalk + inhoud wordt een gewoon blok, zodat de factuur de volle breedte krijgt */
    #app-body { display:block !important; max-width:none !important;
                padding:0 !important; margin:0 !important; gap:0 !important; }
    #app main { padding:0 !important; margin:0 !important; width:100% !important; }
    #app main > div { max-width:none !important; }
    /* de kleuren van de huisstijl ook echt meeprinten */
    #ttg-print, #ttg-print * { -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
    #ttg-print { box-shadow:none !important; max-width:none !important;
                 margin:0 !important; padding:0 !important; background:#fff !important;
                 font-size:11px; line-height:1.35; }
    #ttg-print, #ttg-print table, #ttg-print .blok { page-break-inside:avoid; break-inside:avoid; }
    #ttg-print .prt-kop img { height:56px !important; }
    #ttg-print .prt-kop { font-size:9.5px !important; }
    #ttg-print .prt-body { padding:12px !important; }
    #ttg-print .prt-titel { margin-bottom:8px !important; }
    #ttg-print .prt-titel span { font-size:17px !important; padding:2px 18px !important; }
    #ttg-print td { padding-top:2px !important; padding-bottom:2px !important; }
    #ttg-print .prt-rij { height:auto !important; }
    #ttg-print .prt-voet { margin-top:12px !important; font-size:9px !important; }
    #ttg-print .prt-slogan { margin-top:8px !important; font-size:11px !important; }
    #ttg-print .prt-hand { height:50px !important; }
    #ttg-print .prt-stempel { width:66px !important; height:66px !important; }
    #ttg-print .prt-tekenrij { margin-top:10px !important; }
  }
</style>
</head>

/* ---------- kleine helpers ---------- */
const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const N  = v => Number(v || 0);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = (v, d=0) => N(v).toLocaleString("nl-NL", {minimumFractionDigits:d, maximumFractionDigits:d});
const round5 = v => Math.round(N(v)/5)*5;
const todayISO = () => new Date().toISOString().slice(0,10);
const ym = s => (s||"").slice(0,7);
const MAAND = ["Jan","Feb","Mrt","Apr","Mei","Jun","Jul","Aug","Sep","Okt","Nov","Dec"];
/* dd-mm-jjjj overal */
const dmy = iso => { if(!iso) return ""; const p=String(iso).slice(0,10).split("-"); return p.length===3 ? `${p[2]}-${p[1]}-${p[0]}` : iso; };
const daysUntil = iso => { if(!iso) return null; const d=new Date(iso+"T00:00:00"); const t=new Date(todayISO()+"T00:00:00"); return Math.round((d-t)/86400000); };
const addMonths = (iso, m) => { const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); };
const uid = p => p + "-" + Math.random().toString(36).slice(2,8).toUpperCase();
const norm = s => String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();

/* ---------- migratie van v3 naar v4 ---------- */
const MIGRATIE_RAPPORT = [];
function migreer(oud){
  const s = defaultState();
  if(!oud || typeof oud !== "object") return s;
  const R = (t) => MIGRATIE_RAPPORT.push(t);

  /* assumptions */
  Object.assign(s.assumptions, oud.assumptions || {});
  s.assumptions.autoKasVanaf = (oud.assumptions && oud.assumptions.autoKasVanaf) || AUTO_KAS_VANAF;
  if(!s.assumptions.serviceIntervalKm) s.assumptions.serviceIntervalKm = 5000;
  if(!s.assumptions.serviceWaarschuwKm) s.assumptions.serviceWaarschuwKm = 500;
  /* Alleen een lege of onbekende keuze naar "vast" zetten — niet elke keer overschrijven,
     anders sprong de keuze bij Assumptions bij elke keer laden weer terug. */
  if(s.assumptions.prijsFormule !== "simpel") s.assumptions.prijsFormule = "vast";

  /* klassen — oude namen naar de 4 vaste keys */
  const keyVanNaam = naam => {
    const t = norm(naam);
    if(t.includes("sedan")) return "sedan";
    if(t.includes("minivan") || t.includes("voxy") || t.includes("noah")) return "voxy";
    if(t.includes("minibus") || t.includes("hiace") || t.includes("pitbull") || t.includes("busje")) return "hiace";
    if(t.includes("coaster") || t.includes("groot")) return "coaster";
    return "";
  };
  if(Array.isArray(oud.classes)) {
    oud.classes.forEach(oc => {
      const k = keyVanNaam(oc.naam) || keyVanNaam(oc.key);
      const doel = s.classes.find(c => c.key === k);
      if(doel) ["seats","verbruik","purchaseUsd","insurance","keuring","serviceCost","interval","factor"].forEach(f => {
        if(oc[f] !== undefined && oc[f] !== "") doel[f] = oc[f];
      });
    });
    /* Hiace is 8-12, niet 14 */
    const h = s.classes.find(c=>c.key==="hiace"); if(h && N(h.seats) > 12) h.seats = 12;
  }
  if(oud.serviceBuild && Array.isArray(oud.serviceBuild.items)) {
    const standaard = ["lucht filter","smeer olie filter","smeer olie motorolie","arbeidsloon"];
    const blijft = [], verhuist = [];
    oud.serviceBuild.items.forEach(it => {
      (standaard.includes(norm(it.naam)) ? blijft : verhuist).push(it);
    });
    if(blijft.length) s.serviceBuild.items = blijft;
    s.serviceBuild.interval = oud.serviceBuild.interval || 5000;
    verhuist.forEach((it,i) => {
      s.onderhoud.push({
        id:"OH-M"+(i+1), datum: todayISO(), bus:"", type:"Onderhoud",
        werk: it.naam, garage:"", kmStand:"", kosten: N(it.kosten), betaaldVia:"Kas",
        opmerking:"Overgezet vanuit de oude tab 'Onderhoud kosten'"
      });
    });
    if(verhuist.length) R(`${verhuist.length} regel(s) uit de oude tab 'Onderhoud kosten' verplaatst naar 'Onderhoud & Reparaties' (samen SRD ${nf(verhuist.reduce((a,b)=>a+N(b.kosten),0))}).`);
  }

  /* routes: nieuwe prijskaart is leidend; onbekende eigen routes blijven onderaan staan */
  const nieuwNamen = new Set(s.routes.map(r => norm(r.route)));
  let extra = 0;
  (oud.routes || []).forEach(or => {
    if(nieuwNamen.has(norm(or.route))) return;
    extra++;
    const usd={}, pay={}; KKEYS.forEach(k => { usd[k]=""; pay[k]=""; });
    s.routes.push({ id:"RX"+extra, route: or.route, km: or.km, usd, pay, retour:false, overnights: N(or.overnights) });
  });
  if(extra) R(`${extra} eigen route(s) uit de oude Zonetarieven bewaard (zonder prijs — vul zelf aan).`);

  /* oude chauffeurskaart: busje->sedan, hiace->voxy, coaster->hiace, groot->coaster */
  const oudeMap = { busje:"sedan", hiace:"voxy", coaster:"hiace", groot:"coaster" };
  let payOver = 0;
  (oud.chauffeurPay || []).forEach(cp => {
    const kaart = norm(cp.bestemming);
    let doel = s.routes.find(r => norm(r.route) === kaart);
    if(!doel && kaart.length >= 4) {
      /* naam van de kaart zit in de route, of andersom — pak de dichtstbijzijnde */
      const kandidaten = s.routes.filter(r => {
        const rn = norm(r.route);
        return rn.length >= 4 && (rn.includes(kaart) || kaart.includes(rn));
      });
      kandidaten.sort((a,b) => Math.abs(norm(a.route).length - kaart.length) - Math.abs(norm(b.route).length - kaart.length));
      doel = kandidaten[0];
    }
    if(!doel) {
      const usd={}, pay={}; KKEYS.forEach(k=>{usd[k]="";});
      Object.entries(oudeMap).forEach(([o,nkey]) => pay[nkey] = cp[o]);
      if(KKEYS.some(k => N(pay[k]) > 0)) { s.routes.push({ id:uid("RP"), route: cp.bestemming, km:"", usd, pay, retour:false, overnights:0 }); payOver++; }
      return;
    }
    Object.entries(oudeMap).forEach(([o,nkey]) => { if(cp[o] !== "" && cp[o] != null && N(cp[o]) > 0) doel.pay[nkey] = cp[o]; });
  });
  if(payOver) R(`${payOver} chauffeurspay-rij(en) zonder prijskaart-tegenhanger toegevoegd als eigen bestemming.`);

  /* bussen */
  if(Array.isArray(oud.buses) && oud.buses.length) {
    s.buses = oud.buses.map(b => ({
      id: b.id || uid("B"), naam: b.naam, klasseKey: keyVanNaam(b.klasse) || keyVanNaam(b.merk) || "voxy",
      kenteken: b.kenteken||"", merk: b.merk||"", bouwjaar: b.bouwjaar||"", status: b.status||"Actief",
      aankoopUsd: N(b.aankoopUsd),
      peilKm: N(b.huidigeKm !== undefined ? b.huidigeKm : b.peilKm),
      peilDatum: b.peilDatum || todayISO(),
      opmerking: b.opmerking || ""
    }));
    R(`${s.buses.length} bus(sen) overgenomen; de km-stand van vandaag is als beginstand vastgezet op ${dmy(todayISO())}.`);
  }

  /* records 1-op-1 over */
  s.ritten     = (oud.ritten || []).map(r => Object.assign({}, r, {
    km: N(r.km), dagen: N(r.dagen) || 1, telefoon: r.telefoon || "",
    status: r.status || "Uitgevoerd", betaaldVia: r.betaaldVia || "Kas"
  }));
  s.brandstof  = (oud.brandstof  || []).slice();
  s.schoonmaak = (oud.schoonmaak || []).slice();
  s.verzekeringen = (oud.verzekeringen || []).slice();
  s.serviceBeurten = (oud.serviceBeurten || []).map(sb => ({ ...sb, intervalKm: N(sb.intervalKm) || 5000 }));
  s.invoices   = (oud.invoices   || []).map(iv => ({ ...iv, signed: "Ramlal Anshul" }));
  s.users      = (oud.users      || s.users).slice();
  if(oud.kasboek) s.kasboek = { begin: Object.assign({SRD:0,EUR:0,USD:0}, oud.kasboek.begin||{}), entries: (oud.kasboek.entries||[]).slice() };
  s.counters   = Object.assign(s.counters, oud.counters || {});
  s.log        = (oud.log || []).slice();
  if(Array.isArray(oud.chauffeurs) && oud.chauffeurs.length) s.chauffeurs = oud.chauffeurs.slice();
  s.uitbetalingen = (oud.uitbetalingen || []).slice();
  s.afrekeningen  = (oud.afrekeningen  || []).slice();

  /* oude reparaties -> onderhoud (verplaatsen, niet kopiëren) */
  const rep = oud.reparaties || [];
  const oudTotaal = rep.reduce((a,b)=>a+N(b.kosten),0);
  rep.forEach(p => s.onderhoud.push({
    id: p.id || uid("OH"), datum: p.datum, bus: p.bus, type: p.categorie || "Reparatie",
    werk: p.werk || "", garage: p.garage || "", kmStand: p.kmStand || "", kosten: N(p.kosten),
    betaaldVia: p.betaaldVia || "Kas", opmerking: p.opmerking || ""
  }));
  if(Array.isArray(oud.onderhoud)) oud.onderhoud.forEach(o => s.onderhoud.push(o));
  if(rep.length) {
    const nieuwTotaal = s.onderhoud.filter(o => o.opmerking !== "Overgezet vanuit de oude tab 'Onderhoud kosten'").reduce((a,b)=>a+N(b.kosten),0);
    R(`${rep.length} reparatie(s) verplaatst naar 'Onderhoud & Reparaties'. Totaal vóór: SRD ${nf(oudTotaal)} · totaal ná: SRD ${nf(nieuwTotaal)} ${oudTotaal===nieuwTotaal?"✓ gelijk":"⚠ controleer"}.`);
  }
  return s;
}

/* ---------- ontbrekende onderdelen aanvullen (bij een state van een oudere versie) ---------- */
function vulAan(s){
  if(!s || typeof s !== "object") return s;
  const leeg = defaultState();
  ["ritten","brandstof","schoonmaak","onderhoud","verzekeringen","serviceBeurten",
   "invoices","users","routes","buses","classes","log","chauffeurs","uitbetalingen","afrekeningen"]
    .forEach(k => { if(!Array.isArray(s[k])) s[k] = leeg[k]; });
  if(!s.kasboek || typeof s.kasboek !== "object") s.kasboek = leeg.kasboek;
  if(!s.kasboek.begin) s.kasboek.begin = { SRD:0, EUR:0, USD:0 };
  if(!Array.isArray(s.kasboek.entries)) s.kasboek.entries = [];
  if(!s.serviceBuild || !Array.isArray(s.serviceBuild.items)) s.serviceBuild = leeg.serviceBuild;
  s.assumptions = Object.assign({}, leeg.assumptions, s.assumptions || {});
  s.counters = Object.assign({}, leeg.counters, s.counters || {});
  /* tellers nooit lager dan wat er al staat, anders krijg je dubbele nummers */
  const hoogste = (arr, pre) => arr.reduce((m,x) => {
    const t = String(x.id||"").replace(pre,"").replace(/\D/g,"");
    return t ? Math.max(m, Number(t)) : m; }, 0);
  s.counters.uitb      = Math.max(N(s.counters.uitb), hoogste(s.uitbetalingen,"UB-") + 1, 1);
  s.counters.rit       = Math.max(N(s.counters.rit), hoogste(s.ritten,"RT-") + 1, 1);
  s.counters.brandstof = Math.max(N(s.counters.brandstof), hoogste(s.brandstof,"F-") + 1, 1);
  s.counters.onderhoud = Math.max(N(s.counters.onderhoud), hoogste(s.onderhoud,"OH-") + 1, 1);
  s.counters.schoonmaak= Math.max(N(s.counters.schoonmaak), hoogste(s.schoonmaak,"S-") + 1, 1);
  s.counters.kas       = Math.max(N(s.counters.kas), hoogste(s.kasboek.entries,"KB") + 1, 1);
  s.counters.sb        = Math.max(N(s.counters.sb), hoogste(s.serviceBeurten,"SB-") + 1, 1);
  s.counters.inv       = Math.max(N(s.counters.inv), hoogste(s.invoices,"INV-") + 1, 1);
  /* soort rit: Klant (gewone rit), Familie (alleen kostprijs) of Eigen gebruik.
     Alles wat er al stond is een klantrit, tenzij je hem zelf omzet. */
  s.ritten.forEach(r => {
    if(!r.soort) r.soort = "Klant";
    if(r.eigenNaam == null) r.eigenNaam = "";
    if(!N(r.prijsFactor)) r.prijsFactor = 1;
  });
  /* dagvergoeding per klasse — wat een hele dag met die bus kost bovenop de km */
  const DAGSTANDAARD = { sedan:700, voxy:900, hiace:1100, coaster:1900 };
  s.classes.forEach(c => { if(!N(c.dagVergoeding)) c.dagVergoeding = DAGSTANDAARD[c.key] || 900; });
  /* welke brandstof gaat erin — de coasters rijden op diesel, de rest op benzine */
  s.classes.forEach(c => { if(!c.brandstof) c.brandstof = c.key === "coaster" ? "diesel" : "benzine"; });
  if(!N(s.assumptions.diesel)) s.assumptions.diesel = DIESEL_SEP22;
  if(!N(s.assumptions.petrol)) s.assumptions.petrol = BENZINE_SEP22;
  sorteerBussen(s);
  return s;
}

/* de vaste volgorde waarin de bussen overal staan */
const BUS_VOLGORDE = ["sedan", "noah", "voxy", "pitbull", "coaster1", "coaster2"];
function sorteerBussen(s){
  (s.buses || []).forEach(b => {
    if(!N(b.volgorde)) {
      const i = BUS_VOLGORDE.indexOf(norm(b.naam));
      b.volgorde = i >= 0 ? i + 1 : 90;
    }
  });
  s.buses.sort((a,b) => N(a.volgorde) - N(b.volgorde) || String(a.naam).localeCompare(String(b.naam)));
}

/* ---------- bestemmingen opruimen en korter maken ---------- */
/* overgebleven kopieën uit de omzetting — die hebben geen prijzen */
const DUBBELE_BESTEMMINGEN = [
  "Sloth Sancuary Saramacca Groningen", "Leonsberg drop/ pick",
  "Comm-peperpot-marienb", "Peperpot pick /drop", "Sarramaccca Groningen",
];
/* korte namen: je kiest gewoon "Albina", niet "Albina ophaal/afzet" */
const KORTE_NAMEN = {
  "City tour (3-4 uren)": "City tour",
  "Leonsberg afz/oph": "Leonsberg",
  "Leonsberg afz en oph Marienburg": "Leonsberg + Marienburg",
  "New Amsterdam afz/oph Marienburg": "New Amsterdam + Marienburg",
  "Peperpot hotel afzet of ophaal": "Peperpot hotel",
  "Afgebaka ophaal/afzet": "Afgebaka",
  "Atjonie ophaal/afzet": "Atjonie",
  "Nickerie ophaal/afzet": "Nickerie",
  "Zorg en Hoop one way transfer": "Zorg en Hoop",
  "Sloth Sanctuary Saramacca Groningen": "Sloth Sanctuary Groningen",
};

function ruimBestemmingenOp(s){
  if(!s || s.namenSep2026) return false;
  const R = t => MIGRATIE_RAPPORT.push(t);
  let iets = false;

  /* eerst de lege kopieën eruit */
  const weg = new Set(DUBBELE_BESTEMMINGEN.map(norm));
  const voor = s.routes.length;
  s.routes = s.routes.filter(r => {
    const leeg = KKEYS.every(k => r.usd[k] === "" || r.usd[k] == null);
    return !(weg.has(norm(r.route)) && leeg);
  });
  if(s.routes.length < voor) { R(`${voor - s.routes.length} dubbele bestemming(en) zonder prijs verwijderd.`); iets = true; }

  /* dan de namen inkorten, maar nooit als die naam al bestaat */
  Object.entries(KORTE_NAMEN).forEach(([lang, kort]) => {
    const r = s.routes.find(x => norm(x.route) === norm(lang));
    if(!r) return;
    if(s.routes.some(x => x !== r && norm(x.route) === norm(kort))) return;
    R(`Bestemming "${r.route}" heet nu "${kort}".`);
    r.route = kort; iets = true;
  });

  s.namenSep2026 = true;
  return iets;
}

/* ---------- de bestemming van oude ritten rechtzetten (eenmalig, september 2026) ----------
   Toen de bestemmingen werden ingekort veranderden alleen de Zonetarieven mee, niet de ritten.
   Die hielden de lange naam vast en vonden daardoor geen prijs meer. */
const RIT_HERNOEM = Object.assign({}, KORTE_NAMEN, {
  "Sloth Sancuary Saramacca Groningen" : "Sloth Sanctuary Groningen",
  "Albina drop/ pick"                  : "Albina",
  "Albina ophaal/afzet"                : "Albina",
  "Leonsberg drop/ pick"               : "Leonsberg",
  "Comm-peperpot-marienb"              : "Commewijne - Peperpot - Marienburg",
  "Peperpot pick /drop"                : "Peperpot hotel",
});

function ruimRitBestemmingenOp(s){
  if(!s || s.ritNamenSep2026) return false;
  const R = t => MIGRATIE_RAPPORT.push(t);
  let iets = false;

  /* 1. EAG bestond nog niet als bestemming, terwijl je hem wel rijdt */
  if(!(s.routes||[]).some(r => norm(r.route) === "eag") &&
     (s.ritten||[]).some(r => norm(r.bestemming) === "eag")){
    s.routes.push({ id:uid("R"), route:"EAG", km:10, retour:false, overnights:0,
      usd:{ sedan:"", voxy:35, hiace:"", coaster:95 },
      pay:{ sedan:500, voxy:500, hiace:500, coaster:650 } });
    R(`Bestemming "EAG" toegevoegd aan Zonetarieven — 10 km enkele reis. De prijs komt uit je eigen ritten (voxy/noah USD 35, coaster USD 95). Sedan en hiace staan nog leeg: vul die zelf in.`);
    iets = true;
  }

  /* 2. oude namen, hoofdletters en spaties in de ritten rechtzetten */
  const hernoem = {};
  Object.entries(RIT_HERNOEM).forEach(([oud, nieuw]) => { hernoem[norm(oud)] = nieuw; });
  const telling = {};
  (s.ritten||[]).forEach(r => {
    const nu = String(r.bestemming || "");
    const schoon = nu.trim();
    if(!schoon) return;
    let doel = hernoem[norm(schoon)] || null;
    if(!doel){
      const route = (s.routes||[]).find(x => norm(x.route) === norm(schoon));
      doel = route ? route.route : null;
    }
    /* alleen hernoemen als die bestemming ook echt bestaat */
    if(!doel || !(s.routes||[]).some(x => norm(x.route) === norm(doel))) return;
    if(doel === nu) return;
    const sleutel = `"${nu}" → "${doel}"`;
    telling[sleutel] = (telling[sleutel] || 0) + 1;
    r.bestemming = doel; iets = true;
  });
  Object.entries(telling).forEach(([t, n]) => R(`Bestemming bij ${n} rit(ten) rechtgezet: ${t}.`));

  /* 3. wat daarna nergens bij hoort wordt "Overige", met de oude naam als eigen omschrijving */
  const bestaat = new Set((s.routes||[]).map(x => norm(x.route)));
  const rest = [];
  (s.ritten||[]).forEach(r => {
    const b = String(r.bestemming||"").trim();
    if(!b || norm(b) === "overige" || bestaat.has(norm(b))) return;
    if(!String(r.eigenNaam||"").trim()) r.eigenNaam = b;
    r.bestemming = "Overige";
    rest.push(b); iets = true;
  });
  if(rest.length) R(`${rest.length} rit(ten) met een bestemming die niet in Zonetarieven staat zijn op "Overige" gezet (${rest.join(", ")}). De oude naam staat nu als eigen omschrijving.`);

  s.ritNamenSep2026 = true;
  return iets;
}

/* ---------- brandstofprijzen rechtzetten (eenmalig, september 2026) ----------
   Alles stond op SRD 55 per liter. Uit 72 eigen tankbonnen (bedrag ÷ liters) blijkt:
   benzine ongeveer 48,30 en diesel ongeveer 53,27 — precies wat GOw2 publiceert.
   De bedragen in het kasboek waren goed (die werden elke keer met de hand verbeterd);
   alleen het veld "prijs per liter" klopte niet met het bedrag ernaast. */
function corrigeerBrandstof(s){
  if(!s || s.brandstofSep2026) return false;
  const R = t => MIGRATIE_RAPPORT.push(t);
  let iets = false;

  if(N(s.assumptions.petrol) === 55){
    s.assumptions.petrol = 48.32;
    R(`Benzineprijs 55,00 → 48,32 per liter (GOw2, bijgewerkt 25-03-2026). Diesel staat nu apart op 53,27.`);
    iets = true;
  }

  /* prijs per liter gelijktrekken met het bedrag dat je echt betaald hebt — geen cent verandert aan je kas */
  let n = 0;
  (s.brandstof || []).forEach(x => {
    const l = N(x.liters), t = N(x.totaal);
    if(l <= 0 || t <= 0) return;
    const echt = Math.round(t / l * 100) / 100;
    if(Math.abs(echt - N(x.prijsLiter)) < 0.01) return;
    x.prijsLiter = echt; n++; iets = true;
  });
  if(n) R(`${n} tankbeurt(en): prijs per liter gelijkgetrokken met het bedrag op de bon. De totalen en je kas blijven ongewijzigd.`);

  s.brandstofSep2026 = true;
  return iets;
}

/* Brandstofprijs 22 september 2026 — je tankt nu bij een goedkopere pomp:
   benzine 47,98 · diesel 52,77 per liter (GOw2 publiceert nog 48,32 / 53,27).
   Dit geldt alleen voor nieuwe berekeningen; bestaande tankbeurten houden de prijs
   van hun eigen bon, zodat het kasboek geen cent verandert. Vlag brandstofPrijsSep22. */
const BENZINE_SEP22 = 47.98, DIESEL_SEP22 = 52.77;
function nieuweBrandstofPrijs(s){
  if(!s || s.brandstofPrijsSep22) return false;
  const R = t => MIGRATIE_RAPPORT.push(t);
  let iets = false;
  if(N(s.assumptions.petrol) !== BENZINE_SEP22){
    R(`Benzineprijs ${nf(s.assumptions.petrol,2)} → ${nf(BENZINE_SEP22,2)} per liter (eigen pomp, 22-09-2026).`);
    s.assumptions.petrol = BENZINE_SEP22; iets = true;
  }
  if(N(s.assumptions.diesel) !== DIESEL_SEP22){
    R(`Dieselprijs ${nf(s.assumptions.diesel,2)} → ${nf(DIESEL_SEP22,2)} per liter (eigen pomp, 22-09-2026).`);
    s.assumptions.diesel = DIESEL_SEP22; iets = true;
  }
  s.brandstofPrijsSep22 = true;
  return iets;
}

/* Verbruik — september 2026, gemeten aan de eigen tankbonnen en km-standen.
   Het stond veel te laag (voxy/noah op 7 km/l terwijl ze er 11,5 halen). Daardoor rekende

const VERBRUIK_SEP2026 = { sedan:12, voxy:11.5, hiace:6.4, coaster:5 };
function corrigeerVerbruik(s){

function pasCorrectiesToe(s){
  if(!s || s.correctiesSep2026) return false;
  const R = t => MIGRATIE_RAPPORT.push(t);
  let iets = false;

  /* Ricky 11-08: SRD 8.300 klopt, USD stond ook op 8.300 */
  (s.ritten || []).forEach(r => {
    if(N(r.tariefUsd) > 2000 && N(r.tariefSrd) > 0) {
      const nieuw = Math.round(N(r.tariefSrd) / N(s.assumptions.fxUsd) * 100) / 100;
      R(`Rit ${r.id} (${r.klant||""}): tarief USD ${nf(r.tariefUsd)} → ${nf(nieuw,2)} (SRD ${nf(r.tariefSrd)} ÷ koers).`);
      r.tariefUsd = nieuw; iets = true;
    }
  });

  /* chauffeurspay Nickerie */
  const zet = (routeNaam, waardes) => {
    const r = (s.routes || []).find(x => norm(x.route) === norm(routeNaam));
    if(!r) return;
    Object.entries(waardes).forEach(([k, v]) => {
      if(N(r.pay[k]) !== v) { R(`${r.route} — chauffeurspay ${k}: ${r.pay[k]} → ${v}.`); r.pay[k] = v; iets = true; }
    });
  };
  zet("Nickerie ophaal/afzet", { coaster: 1500 });
  zet("Nickerie 3 days", { sedan: 2250, voxy: 2250, hiace: 3000, coaster: 3750 });

  /* de rit 'Chinezen' hoort op het juli-blad */
  const chin = (s.ritten || []).find(r => norm(r.klant).includes("chinez") && (r.datum || "").startsWith("2026-08"));
  if(chin) { R(`Rit ${chin.id} (Chinezen, SRD ${nf(chin.tariefSrd)}) verplaatst van ${dmy(chin.datum)} naar 04-07-2026, zoals op je juli-blad.`); chin.datum = "2026-07-04"; iets = true; }

  /* servicebeurten met een km-stand die nog op 'Gepland' staan: de km-teller kan pas
     werken als de beurt als uitgevoerd geldt. De verzonnen 'volgende datum' halen we weg —
     je wordt op kilometers gewaarschuwd, niet op een datum die niet klopt. */
  (s.serviceBeurten || []).forEach(sb => {
    if(sb.status !== "Geserviced" && N(sb.kmStand) > 0) {
      R(`Servicebeurt ${sb.bus} (km ${nf(sb.kmStand)}) op 'Geserviced' gezet zodat de km-teller werkt` +
        (sb.volgendeDatum ? `; de volgende-beurt-datum ${dmy(sb.volgendeDatum)} is weggehaald` : "") +
        (sb.datum > todayISO() ? `. Let op: de datum ${dmy(sb.datum)} ligt in de toekomst — pas hem aan naar de dag dat de beurt echt is gedaan.` : "."));
      sb.status = "Geserviced";
      sb.volgendeDatum = "";
      iets = true;
    }
  });

  /* elke bus hoort een servicebeurt-regel te hebben, anders werkt de km-melding niet */
  (s.buses || []).forEach(b => {
    if(!(s.serviceBeurten || []).some(sb => sb.bus === b.naam)) {
      s.serviceBeurten.push({
        id: "SB-" + String(N(s.counters.sb) || 1).padStart(3,"0"),
        bus: b.naam, datum: "", omschrijving: "Vul de km-stand van de laatste beurt in",
        kmStand: "", intervalKm: N(s.assumptions.serviceIntervalKm) || 5000,
        kosten: "", status: "Gepland", volgendeDatum: "", betaaldVia: "Kas"
      });
      s.counters.sb = (N(s.counters.sb) || 1) + 1;
      R(`Lege servicebeurt-regel toegevoegd voor ${b.naam} — vul daar de km-stand van de laatste beurt in.`);
      iets = true;
    }
  });

  s.correctiesSep2026 = true;
  return iets;
}

   Opslag (server) + login
   ============================================================ */
let S = null;            // de complete state
let USER = null;         // ingelogde gebruiker
let TAB = "dashboard";
/* Op een smal scherm (iPad staand, telefoon) zit de zijbalk achter de ☰-knop. */
let menuOpen = false;
let saveTimer = null, saving = false, saveFout = "";

const token = () => localStorage.getItem("ttg-token");

async function api(pad, opties={}) {
  const h = Object.assign({ "Content-Type":"application/json" }, opties.headers||{});
  if(token()) h.Authorization = "Bearer " + token();
  const r = await fetch(pad, Object.assign({}, opties, { headers:h }));
  return r;
}

async function laadState(){
  const r = await api("/api/state");
  if(r.status === 401) { localStorage.removeItem("ttg-token"); return null; }
  if(r.status === 404) return defaultState();
  if(!r.ok) throw new Error("State ophalen mislukt");
  const data = await r.json();
  return vulAan((data && data.versie === 4) ? data : migreer(data));
}

function bewaar(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saving = true; saveFout = ""; tekenStatus();
    try {
      const r = await api("/api/state", { method:"PUT", body: JSON.stringify(S) });
      if(!r.ok) throw new Error("opslaan mislukt");
    } catch(e) { saveFout = "Niet opgeslagen — controleer je internet"; }
    saving = false; tekenStatus();
  }, 700);
}

function tekenStatus(){
  const el = $("#opslag-status");
  if(!el) return;
  el.textContent = saveFout ? "⚠ " + saveFout : (saving ? "Opslaan…" : "Alles opgeslagen");
  el.className = "text-xs " + (saveFout ? "text-red-300 font-bold" : "text-emerald-200/70");
}

/* ============================================================
   Ongedaan maken — elke wijziging bewaart eerst een momentopname
   ============================================================ */
let undoStapel = [], redoStapel = [], laatsteSnapshot = 0;
const MAX_UNDO = 15;

/* roep dit aan vlak vóór je iets verandert */
function mut(reden){
  try {
    undoStapel.push({ json: JSON.stringify(S), reden: reden || "wijziging" });
    if(undoStapel.length > MAX_UNDO) undoStapel.shift();
    redoStapel.length = 0;
    laatsteSnapshot = Date.now();
  } catch(e) { /* geheugen vol of iets dergelijks — dan gewoon zonder undo verder */ }
}

/* voor velden waar je in typt: hooguit één momentopname per paar seconden */
function mutTypen(reden){ if(Date.now() - laatsteSnapshot > 1500) mut(reden); }

function ongedaanMaken(){
  if(!undoStapel.length) { melding("Er is niets meer om ongedaan te maken."); return; }
  const vorige = undoStapel.pop();
  redoStapel.push({ json: JSON.stringify(S), reden: vorige.reden });
  S = JSON.parse(vorige.json);
  bewaar(); render();
  melding(`Ongedaan gemaakt: ${vorige.reden}`, () => opnieuwDoen(), "Toch weer doen");
}

function opnieuwDoen(){
  if(!redoStapel.length) { melding("Er is niets om opnieuw te doen."); return; }
  const volgende = redoStapel.pop();
  undoStapel.push({ json: JSON.stringify(S), reden: volgende.reden });
  S = JSON.parse(volgende.json);
  bewaar(); render();
  melding(`Opnieuw gedaan: ${volgende.reden}`);
}

/* ============================================================
   Berekeningen
   ============================================================ */
const A = () => S.assumptions;
const busVan = naam => S.buses.find(b => b.naam === naam);
const klasseVanBus = naam => { const b = busVan(naam); return b ? b.klasseKey : ""; };
const klasseLabel = k => (KLASSEN.find(x=>x.key===k)||{}).label || "—";
const routeVan = naam => S.routes.find(r => norm(r.route) === norm(naam));

/* welke brandstof gaat er in deze klasse, en wat kost die per liter */
const klasseVan = key => S.classes.find(c => c.key === key) || null;
const brandstofSoort = key => { const c = klasseVan(key); return (c && c.brandstof) === "diesel" ? "diesel" : "benzine"; };
const brandstofPrijs = key => brandstofSoort(key) === "diesel" ? N(A().diesel) : N(A().petrol);
const busBrandstofPrijs = busNaam => brandstofPrijs(klasseVanBus(busNaam));

/* soort rit — familie en eigen gebruik tellen apart mee, zodat je winstpercentage klopt */
const RIT_SOORTEN = [
  ["Klant",   "Klant — gewone rit"],
  ["Familie", "Familie / vriend — alleen kostprijs"],
  ["Eigen",   "Eigen gebruik — geen omzet"],
];
const soortLabel = k => ({ Familie:"familie", Eigen:"eigen gebruik" })[k] || "";
const isKlantRit = r => (r.soort || "Klant") === "Klant";
/* de naam die je in de lijst ziet: bij "Overige" je eigen omschrijving */
const isOverig = naam => norm(naam) === "overige";
const ritNaam = r => (isOverig(r.bestemming) && String(r.eigenNaam||"").trim())
  ? String(r.eigenNaam).trim() : String(r.bestemming||"");

/* prijs van een route in een klasse */
function tariefVan(routeNaam, klasseKey){
  const r = routeVan(routeNaam);
  if(!r || !klasseKey) return { usd:"", srd:"", km:"", pay:"", bron:"Geen bestemming gevonden" };
  const usd = r.usd[klasseKey];
  const srd = (usd === "" || usd == null) ? "" : round5(N(usd) * N(A().fxUsd));
  const pay = r.pay[klasseKey];
  return {
    usd: usd === "" || usd == null ? "" : N(usd),
    srd, km: r.km, pay: (pay === "" || pay == null) ? "" : N(pay),
    bron: `${r.route} · ${klasseLabel(klasseKey)}`
  };
}

/* km van gereden ritten van een bus vanaf een datum (geplande ritten tellen niet mee) */
function ritKmVanaf(busNaam, vanaf){
  return S.ritten
    .filter(r => r.bus === busNaam && r.status !== "Gepland" && r.datum >= (vanaf || "0000-00-00"))
    .reduce((a, r) => a + N(r.km), 0);
}

/* huidige km-stand: beginstand + de km van de ritten vanaf de peildatum */
/* De hoogste échte tellerstand die we van deze bus kennen: uit de km-stand bij terugkomst
   van een rit, of uit de km-stand bij een tankbeurt. Dat is een gemeten getal en dus
   betrouwbaarder dan de optelsom van geschatte rit-km's. */
function gemetenKmStand(busNaam){
  const uitRitten = S.ritten.filter(r => r.bus === busNaam).map(r => N(r.kmTerug));
  const uitTanken = S.brandstof.filter(f => f.bus === busNaam).map(f => N(f.kmStand));
  return Math.max(0, ...uitRitten, ...uitTanken);
}

function huidigeKm(bus){
  const b = typeof bus === "string" ? busVan(bus) : bus;
  if(!b) return 0;
  /* de gewone optelsom, maar nooit lager dan een stand die je echt hebt afgelezen */
  return Math.max(N(b.peilKm) + ritKmVanaf(b.naam, b.peilDatum), gemetenKmStand(b.naam));
}

/* laatste servicebeurt van een bus */
function laatsteService(busNaam){
  return S.serviceBeurten
    .filter(sb => sb.bus === busNaam && sb.status === "Geserviced")
    .sort((a,b) => a.datum > b.datum ? -1 : 1)[0] || null;
}

/* reminder per bus: service-km, service-datum, verzekering, keuring */
function reminders(){
  const waarschuw = N(A().serviceWaarschuwKm) || 500;
  return S.buses.map(b => {
    const meldingen = [];
    let toon = "green";
    const zet = t => { const rang = {green:0, amber:1, red:2}; if(rang[t] > rang[toon]) toon = t; };
    const km = huidigeKm(b.naam);

    /* service op km */
    const sb = laatsteService(b.naam);
    if(sb && N(sb.kmStand) > 0) {
      const interval = N(sb.intervalKm) || N(A().serviceIntervalKm) || 5000;
      const volgende = N(sb.kmStand) + interval;
      const over = volgende - km;
      if(over <= 0) { zet("red"); meldingen.push(`SERVICEBEURT NODIG — ${nf(Math.abs(over))} km over het interval (was nodig bij ${nf(volgende)} km, nu ${nf(km)} km)`); }
      else if(over <= waarschuw) { zet("amber"); meldingen.push(`nog ${nf(over)} km tot de servicebeurt (bij ${nf(volgende)} km)`); }
      else meldingen.push(`nog ${nf(over)} km tot de servicebeurt (bij ${nf(volgende)} km)`);
    } else {
      zet("amber"); meldingen.push("nog geen servicebeurt met km-stand — vul die in bij Servicebeurt");
    }

    /* service op datum */
    if(sb && sb.volgendeDatum) {
      const d = daysUntil(sb.volgendeDatum);
      if(d < 0) { zet("red"); meldingen.push(`datum-service was ${dmy(sb.volgendeDatum)} — OVERTIJD`); }
      else if(d <= 30) { zet("amber"); meldingen.push(`datum-service op ${dmy(sb.volgendeDatum)} (over ${d} dgn)`); }
    }

    /* verzekering en keuring */
    const vz = S.verzekeringen.find(v => v.bus === b.naam);
    const check = (datum, wat) => {
      if(!datum) return;
      const d = daysUntil(datum);
      if(d < 0)       { zet("red");   meldingen.push(`${wat} is VERLOPEN sinds ${dmy(datum)} — bus niet inzetbaar`); }
      else if(d <= 7) { zet("red");   meldingen.push(`${wat} vervalt over ${d} dg op ${dmy(datum)}`); }
      else if(d <= 30){ zet("amber"); meldingen.push(`${wat} vervalt over ${d} dgn op ${dmy(datum)}`); }
    };
    if(vz) { check(vz.verzVervalt, "Verzekering"); check(vz.keurVervalt, "Keuring"); }
    else { zet("amber"); meldingen.push("geen verzekering/keuring vastgelegd"); }

    return { bus: b.naam, toon, km, meldingen };
  });
}

function busNietInzetbaar(busNaam){
  const vz = S.verzekeringen.find(v => v.bus === busNaam);
  if(!vz) return false;
  return (vz.verzVervalt && daysUntil(vz.verzVervalt) < 0) || (vz.keurVervalt && daysUntil(vz.keurVervalt) < 0);
}

/* ============================================================
   Kasboek — handmatige regels + automatische regels uit de bron
   ============================================================ */
function autoKasRegels(){
  const vanaf = A().autoKasVanaf || AUTO_KAS_VANAF;
  const uit = [];
  /* bus/wie houden we apart bij, zodat we een handmatige regel alleen als dubbel
     kunnen aanwijzen als het echt om dezelfde bus of dezelfde chauffeur gaat */
  const voeg = (bron, id, datum, oms, categorie, inBedrag, uitBedrag, valuta, negeerStartdatum, bus, wie) => {
    if(!datum) return;
    if(!N(inBedrag) && !N(uitBedrag)) return;      /* een regel van 0 hoort niet in het kasboek */
    if(!negeerStartdatum && datum < vanaf) return;
    uit.push({ id: bron+":"+id, auto:true, bron, bronId:id, datum, omschrijving:oms, bus:bus||"", wie:wie||"",
               categorie, valuta: valuta||"SRD", in:inBedrag, uit:uitBedrag, opmerking:"" });
  };
  /* kosten die JIJ uit je kas betaalt — wat Borger voorschiet gaat pas uit je kas
     zodra je hem terugbetaalt, dus dat boeken we hier niet.
     Schoonmaak staat er bewust niet bij: dat zit in de uitbetaling van de chauffeur. */
  const uitKas = x => (x.betaaldVia || "Kas") === "Kas";

  S.brandstof.filter(uitKas).forEach(f => voeg("Brandstof", f.id, f.datum,
    `${f.bus||"—"} — brandstof ${f.liters?nf(f.liters)+" l":""} ${f.station?"("+f.station+")":""}`.trim(), "Brandstof", 0, N(f.totaal), "SRD", false, f.bus));
  S.onderhoud.filter(uitKas).forEach(o => voeg("Onderhoud", o.id, o.datum,
    `${o.bus||"—"} — ${o.type||"Onderhoud"}: ${o.werk||""}`.trim(), "Onderhoud", 0, N(o.kosten), "SRD", false, o.bus));
  S.serviceBeurten.filter(sb => sb.status === "Geserviced" && uitKas(sb))
    .forEach(sb => voeg("Servicebeurt", sb.id, sb.datum, `${sb.bus||"—"} — servicebeurt`, "Servicebeurt", 0, N(sb.kosten), "SRD", false, sb.bus));

  /* chauffeursuitbetalingen: jij betaalt = meteen uit de kas.
     Borger betaalt = pas uit je kas op de dag dat je hem terugbetaalt. */
  (S.uitbetalingen || []).forEach(u => {
    const periode = u.vanaf || u.tot ? ` (${dmy(u.vanaf)} t/m ${dmy(u.tot)})` : "";
    if((u.betaaldDoor || "Anshul") === "Anshul")
      voeg("Chauffeur", u.id, u.datum, `Uitbetaling ${u.chauffeur||""}${periode}`, "Chauffeur", 0, N(u.bedrag), "SRD", true, "", u.chauffeur);
    else if(u.terugbetaaldOp)
      voeg("Chauffeur", u.id, u.terugbetaaldOp, `Terugbetaald aan Borger — ${u.chauffeur||""}${periode}`, "Chauffeur", 0, N(u.bedrag), "SRD", true, "", u.chauffeur);
  });

  return uit;
}

const maandNaam = m => m ? `${MAAND[N(m.slice(5,7))-1]} ${m.slice(0,4)}` : "";

function alleKasRegels(){
  const hand = (S.kasboek.entries || []).map(e => Object.assign({ auto:false }, e));
  return hand.concat(autoKasRegels()).sort((a,b) => (a.datum === b.datum) ? (a.id > b.id ? 1 : -1) : (a.datum > b.datum ? 1 : -1));
}

/* op centen afronden, anders krijg je rare uitkomsten als 60.639,99999 */
const cent = v => Math.round(N(v) * 100) / 100;

function kasSaldo(valuta){
  const begin = N((S.kasboek.begin||{})[valuta]);
  return cent(alleKasRegels().filter(e => (e.valuta||"SRD") === valuta)
    .reduce((a,e) => a + N(e.in) - N(e.uit), begin));
}

/* maand-cijfers */
function maandCijfers(maand){
  const inM = arr => arr.filter(x => ym(x.datum) === maand);
  const som = (arr, veld) => arr.reduce((a,x) => a + N(x[veld]), 0);
  const ritten = inM(S.ritten);
  const omzet = som(ritten, "tariefSrd");
  const chauffeurs = som(ritten, "chauffeurPay");
  const brandstof = som(inM(S.brandstof), "totaal");
  const schoonmaak = som(inM(S.schoonmaak), "kosten");
  const onderhoud = som(inM(S.onderhoud), "kosten");
  const service = som(inM(S.serviceBeurten).filter(s => s.status === "Geserviced"), "kosten");
  const verzekering = som(S.verzekeringen, "verzJaar") / 12;
  const keuring = som(S.verzekeringen, "keurJaar") / 12;
  const kosten = chauffeurs + brandstof + schoonmaak + onderhoud + service + verzekering + keuring;
  return { ritten: ritten.length, omzet, chauffeurs, brandstof, schoonmaak, onderhoud, service, verzekering, keuring, kosten, netto: omzet - kosten };
}

/* winst per rit */
/* schoonmaak is niet elke rit — we verdelen wat je die maand aan die bus
   hebt uitgegeven over de ritten die die bus die maand heeft gereden */
let schoonCache = null;
function schoonmaakPerRit(busNaam, maand){
  if(!schoonCache){
    schoonCache = {};
    const kosten = {}, aantal = {};
    S.schoonmaak.forEach(x => {
      const k = x.bus + "|" + String(x.datum||"").slice(0,7);
      kosten[k] = (kosten[k] || 0) + N(x.kosten);
    });
    S.ritten.forEach(x => {
      if(x.status === "Gepland") return;
      const k = x.bus + "|" + String(x.datum||"").slice(0,7);
      aantal[k] = (aantal[k] || 0) + 1;
    });
    Object.keys(kosten).forEach(k => { if(aantal[k]) schoonCache[k] = cent(kosten[k] / aantal[k]); });
  }
  return schoonCache[busNaam + "|" + String(maand||"")] || 0;
}

/* echte winst per rit: tarief min alles wat die rit je kost */
function ritWinst(r){
  const b  = busVan(r.bus);
  const kl = b ? S.classes.find(c => c.key === b.klasseKey) : null;
  const a  = A();
  const km = N(r.km);
  const verbruik  = kl ? N(kl.verbruik) : 7;
  /* de coasters rijden op diesel, de rest op benzine — elk met zijn eigen prijs */
  const literPrijs = kl ? brandstofPrijs(kl.key) : N(a.petrol);
  const brandstof = verbruik > 0 ? (km / verbruik) * literPrijs : 0;
  const jaarVast  = kl ? (N(kl.purchaseUsd) * N(a.fxUsd) / Math.max(N(a.years),1)
                          + N(kl.insurance) + N(kl.keuring)) : 0;
  const vast      = km * (jaarVast / Math.max(N(a.avgKmYr), 1));
  const service   = kl ? km * (N(kl.serviceCost) / Math.max(N(kl.interval), 1)) : 0;
  const schoon    = schoonmaakPerRit(r.bus, String(r.datum||"").slice(0,7));
  const chauffeur = N(r.chauffeurPay);
  const kosten    = chauffeur + brandstof + vast + service + schoon;
  const tarief    = N(r.tariefSrd);
  return { brandstofKost:brandstof, brandstof, vast, service, schoon, chauffeur, kosten,
           winst: tarief - kosten, pct: tarief > 0 ? (tarief - kosten) / tarief * 100 : 0 };
}

/* De zijbalk. Groepen waar voor deze gebruiker niets in zit slaan we over,
   zodat een User geen leeg kopje "Geld" ziet staan. */
function zijbalk(){
  return GROEPEN.map(g => {
    const items = zichtbareTabs().filter(t => t.groep === g);
    if(!items.length) return "";
    const kopje = g ? `<div class="text-[10px] uppercase tracking-wider font-bold text-emerald-300/60 px-3 pt-3 pb-0.5">${g}</div>` : "";
    return kopje + items.map(t => `<button data-act="tab" data-tab="${t.key}"
      class="w-full text-left px-3 py-1.5 rounded-lg text-[13px] font-bold mb-0.5 leading-snug ${TAB===t.key
        ? "bg-[#f0b429] text-[#0b3d24]"
        : "text-emerald-100 hover:bg-white/10"}">${t.label}</button>`).join("");
  }).join("");
}

let modalOpslaan = null;
function toonModal(titel, velden, opslaan, extraHtml){
  modalOpslaan = opslaan;
  $("#modal-laag").innerHTML = `
   <div class="fixed inset-0 bg-black/60 flex items-start justify-center p-4 overflow-y-auto z-50" data-act="modal-achtergrond">
     <form id="modal-form" class="card w-full max-w-lg my-8" onsubmit="return false;">
       <div class="card-h"><h3 class="font-bold">${titel}</h3><button class="text-white text-xl leading-none" data-act="modal-sluit">×</button></div>
       <div class="p-5 space-y-3">
         ${velden.map(v => veldHtml(v)).join("")}
         ${extraHtml||""}
       </div>
       <div class="p-4 bg-slate-50 flex justify-end gap-2">
         ${knop("modal-sluit","Annuleren","btn-w")}
         ${knop("modal-opslaan","Opslaan","btn-y")}
       </div>
     </form></div>`;
}
function veldHtml(v){
  if(v.type === "kop") return `<div class="text-[11px] font-black uppercase tracking-wider text-emerald-800 pt-2">${v.label}</div>`;
  if(v.type === "check") return `<div ${v.wrapAttr||""}>
      <label class="flex items-center gap-2 cursor-pointer">
        <input type="checkbox" class="w-4 h-4 accent-emerald-700" name="${v.naam}" ${v.waarde?"checked":""}>
        <span class="text-xs font-bold text-slate-600">${v.label}</span></label>
      ${v.hint?`<span class="block text-[11px] text-slate-500 mt-0.5" data-hint="${v.naam}">${v.hint}</span>`:""}</div>`;
  const naam = `name="${v.naam}"`;
  let veld;
  if(v.type === "select")      veld = `<select class="inp" ${naam}>${v.opties.map(o => { const [w,l]=Array.isArray(o)?o:[o,o];
                                       return `<option value="${esc(w)}" ${String(w)===String(v.waarde)?"selected":""}>${esc(l)}</option>`; }).join("")}</select>`;
  else if(v.type === "textarea") veld = `<textarea class="inp" rows="2" ${naam}>${esc(v.waarde)}</textarea>`;
  else if(v.type === "datalist") veld = `<input class="inp" ${naam} list="${v.naam}-lijst" value="${esc(v.waarde)}" autocomplete="off">
                                         <datalist id="${v.naam}-lijst">${v.opties.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
  else veld = `<input class="inp" type="${v.type||"text"}" ${naam} value="${esc(v.waarde==null?"":v.waarde)}" ${v.attr||""}>`;
  return `<label class="block" ${v.wrapAttr||""}><span class="text-xs font-bold text-slate-600">${v.label}</span>${veld}${v.na||""}
          ${v.hint?`<span class="block text-[11px] text-slate-500 mt-0.5" data-hint="${v.naam}">${v.hint}</span>`:""}</label>`;
}
function sluitModal(){ $("#modal-laag").innerHTML = ""; modalOpslaan = null; }
function modalWaarden(){
  const f = $("#modal-form"); const o = {};
  if(!f) return o;
  Array.from(f.elements).forEach(el => {
    if(el.name) o[el.name] = el.type === "checkbox" ? el.checked : el.value;
  });
  return o;
}

/* ============================================================
   Dashboard
   ============================================================ */
/* Welke periode staat het Dashboard op? null = de maand van vandaag.
   Een waarde is "2026-09" (één maand) of "jaar:2026" (heel dat jaar). */
let dashPeriode = null;

/* Alle maanden waar data in zit, nieuwste eerst. De huidige maand staat er
   altijd bij, ook als er nog niets is ingevoerd. */
function dataMaanden(){
  const uitData = [].concat(S.ritten, S.brandstof, S.schoonmaak, S.onderhoud, S.serviceBeurten)
    .map(x => ym(x.datum)).filter(Boolean);
  return Array.from(new Set(uitData.concat(ym(todayISO())))).sort().reverse();
}
/* Welke maanden vallen er in de gekozen periode? */
function periodeMaanden(sel){
  if(sel.startsWith("jaar:")) return dataMaanden().filter(m => m.startsWith(sel.slice(5)));
  return [sel];
}
function periodeLabel(sel){
  if(sel.startsWith("jaar:")) return "heel " + sel.slice(5);
  return MAAND[N(sel.slice(5,7))-1].toLowerCase() + " " + sel.slice(0,4);
}
/* Telt de maandcijfers van de hele periode bij elkaar op.
   Let op: verzekering en keuring rekenen per maand 1/12 van het jaarbedrag,
   dus over een jaar met 6 maanden data is dat ook 6/12 van de premie. */
function periodeCijfers(sel){
  const tot = { ritten:0, omzet:0, chauffeurs:0, brandstof:0, schoonmaak:0,
                onderhoud:0, service:0, verzekering:0, keuring:0, kosten:0, netto:0 };
  periodeMaanden(sel).forEach(mm => {
    const c = maandCijfers(mm);
    Object.keys(tot).forEach(k => tot[k] += c[k]);
  });
  return tot;
}

function viewDashboard(){
  const maanden = dataMaanden();
  const geldig = dashPeriode && (dashPeriode.startsWith("jaar:") || maanden.includes(dashPeriode));
  const sel = geldig ? dashPeriode : ym(todayISO());
  const inMaanden = periodeMaanden(sel);
  const inPeriode = d => inMaanden.includes(ym(d));
  const lab = periodeLabel(sel);
  const jaren = Array.from(new Set(maanden.map(mm => mm.slice(0,4)))).sort().reverse();

  const m = periodeCijfers(sel);
  const al = reminders();
  const leegPay = S.routes.filter(r => KKEYS.some(k => r.pay[k] === "" || r.pay[k] == null));
  const kasSRD = kasSaldo("SRD");

  return `
  <div class="bg-white/10 rounded-xl px-4 py-3 flex items-center gap-3 flex-wrap">
    <span class="text-emerald-50 text-sm font-bold">Periode</span>
    <select class="inp max-w-[200px]" data-act="dash-periode">
      ${maanden.map(mm => `<option value="${mm}" ${sel===mm?"selected":""}>${MAAND[N(mm.slice(5,7))-1]} ${mm.slice(0,4)}</option>`).join("")}
      ${jaren.map(j => `<option value="jaar:${j}" ${sel==="jaar:"+j?"selected":""}>Heel ${j}</option>`).join("")}
    </select>
    <span class="text-emerald-200/70 text-xs">De kas en de meldingen hieronder blijven altijd de stand van nu.</span>
  </div>

  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    ${stat("Omzet — " + lab, "SRD " + nf(m.omzet), `${m.ritten} rit${m.ritten===1?"":"ten"}`)}
    ${stat("Kosten — " + lab, "SRD " + nf(m.kosten), "incl. chauffeurs & brandstof", "text-red-700")}
    ${stat("Netto — " + lab, "SRD " + nf(m.netto), m.netto>=0?"winst":"verlies", m.netto>=0?"text-emerald-900":"text-red-700")}
    ${stat("Kas SRD", "SRD " + nf(kasSRD), "contant saldo nu", kasSRD>=0?"text-emerald-900":"text-red-700")}
  </div>

  ${card("🔔 Meldingen per bus",
    "Groen = in orde · Geel = binnenkort actie nodig · Rood = nu actie nodig. Verzekering en keuring melden 30 dagen geel en 7 dagen rood.",
    `<div class="p-4 grid md:grid-cols-2 gap-2">
      ${al.map(a => `<div class="rounded-lg border px-3 py-2.5 text-sm ${toonKleur[a.toon]}">
        <div class="font-bold flex items-center justify-between">
          <span>${a.toon==="red"?"🔴":a.toon==="amber"?"🟡":"🟢"} ${esc(a.bus)} ${busNietInzetbaar(a.bus)?'<span class="pill bg-red-600 text-white ml-1">NIET INZETBAAR</span>':""}</span>
          <span class="text-xs font-normal">${nf(a.km)} km</span></div>
        <ul class="mt-1 space-y-0.5 text-[12.5px]">${a.meldingen.map(t=>`<li>· ${esc(t)}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>`)}

  ${leegPay.length ? card("⚠ Chauffeurspay nog niet ingevuld",
    "Bij deze bestemmingen is nog geen bedrag per klasse ingevuld. Zonder bedrag pakt een rit de standaardfee uit Assumptions.",
    `<div class="p-4 text-sm text-slate-700"><ul class="list-disc pl-5 space-y-0.5">
      ${leegPay.map(r => `<li><b>${esc(r.route)}</b> — leeg bij: ${KKEYS.filter(k=>r.pay[k]===""||r.pay[k]==null).map(k=>klasseLabel(k)).join(", ")}</li>`).join("")}
     </ul></div>`,
     knop("tab","Naar Chauffeurs","btn-y",'data-tab="chauffeurs"')) : ""}

  ${card("Per bus — " + lab, "Omzet, kosten en netto bijdrage per bus.",
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Bus</th><th>Klasse</th><th>Ritten</th><th>Omzet SRD</th><th>Chauffeur</th><th>Brandstof</th><th>Onderhoud</th><th>Netto</th><th>Km-stand</th></tr></thead>
      <tbody>${S.buses.map(b => {
        const rit = S.ritten.filter(r => r.bus === b.naam && inPeriode(r.datum));
        const omzet = rit.reduce((a,r)=>a+N(r.tariefSrd),0);
        const ch = rit.reduce((a,r)=>a+N(r.chauffeurPay),0);
        const br = S.brandstof.filter(f=>f.bus===b.naam && inPeriode(f.datum)).reduce((a,f)=>a+N(f.totaal),0);
        const oh = S.onderhoud.filter(o=>o.bus===b.naam && inPeriode(o.datum)).reduce((a,o)=>a+N(o.kosten),0)
                 + S.schoonmaak.filter(w=>w.bus===b.naam && inPeriode(w.datum)).reduce((a,w)=>a+N(w.kosten),0)
                 + S.serviceBeurten.filter(s=>s.bus===b.naam && inPeriode(s.datum) && s.status==="Geserviced").reduce((a,s)=>a+N(s.kosten),0);
        const netto = omzet - ch - br - oh;
        return `<tr><td class="font-bold">${esc(b.naam)}</td><td>${klasseLabel(b.klasseKey)}</td><td>${rit.length}</td>
          <td>${nf(omzet)}</td><td>${nf(ch)}</td><td>${nf(br)}</td><td>${nf(oh)}</td>
          <td class="font-bold ${netto>=0?"text-emerald-800":"text-red-700"}">${nf(netto)}</td><td>${nf(huidigeKm(b.naam))}</td></tr>`;
      }).join("")}</tbody></table></div>`)}
  `;
}

/* ============================================================
   Dagboek — wat is er vandaag gebeurd
   ============================================================ */
let dagboekDatum = null;
function viewDagboek(){
  const d = dagboekDatum || todayISO();
  const rit = S.ritten.filter(r => r.datum === d);
  const br  = S.brandstof.filter(x => x.datum === d);
  const sm  = S.schoonmaak.filter(x => x.datum === d);
  const oh  = S.onderhoud.filter(x => x.datum === d);
  const sb  = S.serviceBeurten.filter(x => x.datum === d);
  const kas = alleKasRegels().filter(x => x.datum === d);
  const inSRD  = kas.filter(k=>(k.valuta||"SRD")==="SRD").reduce((a,k)=>a+N(k.in),0);
  const uitSRD = kas.filter(k=>(k.valuta||"SRD")==="SRD").reduce((a,k)=>a+N(k.uit),0);
  const meld = reminders().filter(a => a.toon !== "green");
  const mut = (S.log||[]).filter(l => l.datum === d);

  const blok = (titel, regels) => regels.length ? `<div class="mb-3"><div class="font-bold text-emerald-900 text-sm">${titel}</div>
      <ul class="text-[13px] text-slate-700 pl-4 list-disc space-y-0.5 mt-1">${regels.map(r=>`<li>${r}</li>`).join("")}</ul></div>` : "";

  const tekst = [
    `*TTG Dagboek — ${dmy(d)}*`,
    rit.length ? `Ritten: ${rit.length} · omzet SRD ${nf(rit.reduce((a,r)=>a+N(r.tariefSrd),0))}` : "Ritten: geen",
    br.length  ? `Brandstof: ${br.length} × · SRD ${nf(br.reduce((a,f)=>a+N(f.totaal),0))}` : "",
    oh.length  ? `Onderhoud: ${oh.length} × · SRD ${nf(oh.reduce((a,o)=>a+N(o.kosten),0))}` : "",
    sm.length  ? `Schoonmaak: ${sm.length} × · SRD ${nf(sm.reduce((a,w)=>a+N(w.kosten),0))}` : "",
    sb.length  ? `Servicebeurten: ${sb.length} ×` : "",
    `Kas SRD: +${nf(inSRD)} / -${nf(uitSRD)} → saldo SRD ${nf(kasSaldo("SRD"))}`,
    meld.length ? `Meldingen: ${meld.map(m=>m.bus+" — "+m.meldingen[0]).join(" | ")}` : "Meldingen: geen",
  ].filter(Boolean).join("\n");

  return card(`📔 Dagboek — ${dmy(d)}`,
    "Alles wat op deze dag is ingevoerd of gebeurd. Kies een andere datum om terug te kijken. Met de knop kopieer je een korte samenvatting voor WhatsApp.",
    `<div class="p-4">
      <div class="flex items-end gap-3 flex-wrap mb-4">
        <label class="text-xs font-bold text-slate-600">Datum<input class="inp mt-1" type="date" data-act="dagboek-datum" value="${d}"></label>
        ${knop("dagboek-vandaag","Vandaag","btn-w")}
        ${knop("dagboek-kopieer","📋 Kopieer voor WhatsApp","btn-y")}
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          ${blok("Ritten", rit.map(r => `${esc(r.bus)} → <b>${esc(ritNaam(r))}</b> · ${esc(r.klant||"")} · SRD ${nf(r.tariefSrd)} · chauffeur ${nf(r.chauffeurPay)} · ${nf(r.km)} km <span class="pill bg-slate-200 text-slate-700">${esc(r.status||"")}</span>${isKlantRit(r)?"":` <span class="pill bg-sky-100 text-sky-800">${esc(soortLabel(r.soort))}</span>`}`))}
          ${blok("Brandstof", br.map(f => `${esc(f.bus)} · ${nf(f.liters)} l · SRD ${nf(f.totaal)} ${f.station?"("+esc(f.station)+")":""}`))}
          ${blok("Onderhoud & reparaties", oh.map(o => `${esc(o.bus)} · ${esc(o.type)} · ${esc(o.werk)} · SRD ${nf(o.kosten)}`))}
          ${blok("Schoonmaak", sm.map(w => `${esc(w.bus)} · ${esc(w.soort)} · SRD ${nf(w.kosten)}`))}

          ${(!rit.length && !br.length && !oh.length && !sm.length && !sb.length) ? `<div class="text-slate-500 text-sm">Op deze dag is niets ingevoerd.</div>` : ""}
        </div>

/* de keuzelijst met bestemmingen; een oude bestemming die niet meer in Zonetarieven
   staat zetten we er bovenaan bij, zodat je hem bij het bewerken niet kwijtraakt */
function bestemmingOpties(huidige, metOverige){
  const namen = S.routes.map(x => x.route);
  const opties = [["", "— kies een bestemming —"]];
  if(metOverige) opties.push(["Overige", "Overige — zelf invullen"]);
  namen.forEach(n => opties.push(n));
  if(huidige && !isOverig(huidige) && !namen.some(n => norm(n) === norm(huidige)))
    opties.splice(metOverige ? 2 : 1, 0, huidige);
  return opties;
}

/* vult de automatische velden in het rit-formulier */
/* welke bestemming stond er vóór de laatste wijziging in het formulier */
let ritVorigeBestemming = "";

/* waarschuwing onder het km-veld: zonder km rekent de app geen benzine mee */
function ritKmHint(){
  const f = $("#modal-form"); if(!f) return;
  const h = f.querySelector('[data-hint="km"]'); if(!h) return;
  h.innerHTML = N(f.km.value)
    ? `Heen én terug samen. Breng je ze weg <b>én</b> haal je ze later op? Druk dan op × 2.`
    : `<span class="text-red-600 font-bold">Zonder km rekent de app geen benzine mee en lijkt de winst veel te hoog. Vul de km in.</span>`;
}

function ritVulAan(forceer){
  const f = $("#modal-form"); if(!f) return;
  const busNaam = f.bus.value, kl = klasseVanBus(busNaam);
  const overig = isOverig(f.bestemming.value);
  /* het veld voor je eigen omschrijving hoort alleen bij "Overige" */
  const toon = (naam, ja) => { const el = f.querySelector(`[data-veld="${naam}"]`); if(el) el.style.display = ja ? "" : "none"; };
  toon("eigenNaam", overig);
  /* bij een bekende bestemming rekent het vinkje de km zelf uit;
     bij Overige is er geen afstand om mee te rekenen, dus daar staat de × 2-knop */
  toon("heenTerug2", !overig);
  toon("kmX2", overig);
  toon("prijsFactor", !overig);   /* bij Overige is er geen kaartprijs om mee te vermenigvuldigen */
  const t = tariefVan(f.bestemming.value, kl);
  const hint = f.querySelector('[data-hint="bestemming"]');
  if(hint) {
    if(!kl) hint.innerHTML = `<span class="text-red-600 font-bold">Deze bus heeft geen klasse — koppel er één bij Wagenpark.</span>`;
    else if(overig) hint.innerHTML = `<span class="text-emerald-800 font-bold">Vul hieronder zelf in wat het was, plus km, tarief en chauffeurspay.</span> Er wordt niets automatisch ingevuld.`;
    else if(!f.bestemming.value) hint.innerHTML = `Kies een bestemming — km, tarief en chauffeurspay vullen zich dan vanzelf. Staat hij er niet bij? Kies <b>Overige</b>.`;
    else if(!routeVan(f.bestemming.value)) hint.innerHTML = `<span class="text-amber-700">Deze bestemming staat niet meer in Zonetarieven — vul de bedragen zelf in.</span>`;
    else hint.innerHTML = `Uit Zonetarieven: <b>${esc(t.bron)}</b>${t.usd===""?' <span class="text-red-600 font-bold">— bij deze bestemming staat nog geen prijs in Zonetarieven, vul die daar in</span>':""}${t.pay===""?' <span class="text-amber-700">(geen chauffeurspay ingevuld — standaardfee gebruikt)</span>':""}`;
  }
  /* stap je net óver naar Overige? dan gooien we wat er automatisch was ingevuld weer leeg.
     Bij het bewerken van een bestaande Overige-rit blijft alles natuurlijk staan. */
  if(overig && forceer && !isOverig(ritVorigeBestemming)){
    ["km","tariefUsd","tariefSrd","chauffeurPay"].forEach(v => { f[v].value = ""; });
  }
  ritVorigeBestemming = f.bestemming.value;

  const zetAls = (veld, waarde) => {
    if(overig) return;               /* bij Overige vul je alles zelf in */
    if(waarde === "" || waarde == null) return;
    if(forceer || !N(f[veld].value)) f[veld].value = waarde;
  };
  const dagen = Math.max(1, N(f.dagen.value) || 1);
  /* de km in Zonetarieven is de enkele reis; de bus rijdt heen en terug.
     Breng je ze én haal je ze op, dan gaat dat nog een keer maal twee. */
  const dubbel = (f.heenTerug2 && f.heenTerug2.checked) ? 2 : 1;
  zetAls("km", t.km === "" ? "" : N(t.km) * Math.max(N(A().roundTrip), 1) * dubbel);
  /* twee partijen samen in één bus: jij rekent 1,5 keer de kaartprijs, niet 2 keer */
  const pf = Math.max(N(f.prijsFactor.value) || 1, 0.1);
  zetAls("tariefUsd", t.usd === "" ? "" : Math.round(N(t.usd) * pf * 100) / 100);
  zetAls("tariefSrd", t.srd === "" ? "" : round5(N(t.srd) * pf));
  const basisPay = t.pay === "" ? N(A().driverFee) : N(t.pay);
  /* meerdaags: pay per dag, tenzij de kaartprijs al voor meerdere dagen geldt */
  const meerdaagsInNaam = /(\d)\s*(dag|day)/i.test(f.bestemming.value || "");
  zetAls("chauffeurPay", meerdaagsInNaam ? basisPay : basisPay * dagen);
  ritKmHint();
}

function ritModal(r, isNieuw){
  ritVorigeBestemming = r.bestemming || "";
  toonModal(isNieuw ? "Nieuwe rit" : "Rit bewerken", ritVelden(r), (v) => {
    if(!v.bus)        return "Kies een bus.";
    if(!v.bestemming) return "Vul een bestemming in.";
    if(isOverig(v.bestemming) && !String(v.eigenNaam||"").trim())
      return "Vul bij Overige een eigen omschrijving in, anders weet je later niet meer wat voor rit het was.";
    const doel = isNieuw ? { id:"RT-" + String(S.counters.rit++).padStart(4,"0") } : S.ritten.find(x => x.id === r.id);
    Object.assign(doel, {
      datum:v.datum, bus:v.bus, bestemming:v.bestemming, eigenNaam:String(v.eigenNaam||"").trim(),
      soort:v.soort || "Klant", heenTerug2: !!v.heenTerug2, prijsFactor: N(v.prijsFactor) || 1,
      dagen:N(v.dagen)||1, klant:v.klant,
      kmVertrek:N(v.kmVertrek), kmTerug:N(v.kmTerug),
      km:N(v.km), tariefUsd:N(v.tariefUsd), tariefSrd:N(v.tariefSrd), chauffeurPay:N(v.chauffeurPay),
      status:v.status, betaaldVia:v.betaaldVia, opmerking:v.opmerking
    });
    if(isNieuw) S.ritten.push(doel);
    logMut(isNieuw?"toegevoegd":"gewijzigd", "rit", `${v.bus} → ${ritNaam(doel)}`);
    if(busNietInzetbaar(v.bus)) alert(`Let op: ${v.bus} heeft een verlopen verzekering of keuring.`);
  });
  setTimeout(() => {
    const f = $("#modal-form"); if(!f) return;
    ["bus","bestemming","dagen","heenTerug2","prijsFactor"].forEach(veld => {
      if(f[veld]) f[veld].addEventListener("change", () => ritVulAan(true));
    });
    /* twee km-standen ingevuld = de echte afstand van deze rit, die wint van de schatting */
    const uitKmStanden = () => {
      const v = N(f.kmVertrek.value), t = N(f.kmTerug.value);
      if(v > 0 && t > v){ f.km.value = t - v; }
      ritKmHint();
    };
    f.kmVertrek.addEventListener("input", uitKmStanden);
    f.kmTerug.addEventListener("input", uitKmStanden);
    f.km.addEventListener("input", ritKmHint);
    if(isNieuw) ritVulAan(true); else ritVulAan(false);
  }, 0);
}

/* ============================================================
   Zonetarieven — prijskaart in USD, SRD = USD × koers, afgerond op 5
   ============================================================ */
/* Wat staat er in Zonetarieven tegenover wat er in het echt gereden is?
   Alleen ritten waarbij je béide km-standen hebt ingevuld tellen mee. Ritten waarbij je ze
   wegbracht én later ophaalde laten we weg — die rijden de route twee keer en vertekenen het beeld. */
function gemetenRoute(routeNaam){
  const ritten = S.ritten.filter(r => !r.heenTerug2 && norm(r.bestemming) === norm(routeNaam)
                   && N(r.kmVertrek) > 0 && N(r.kmTerug) > N(r.kmVertrek));
  if(!ritten.length) return null;
  const totaal = ritten.reduce((a,r) => a + (N(r.kmTerug) - N(r.kmVertrek)), 0);
  return { ritten: ritten.length, gemiddeld: totaal / ritten.length };
}

function kaartGemetenAfstanden(){
  const heenTerug = Math.max(N(A().roundTrip), 1);
  const rijen = S.routes.map(r => ({ r, m: gemetenRoute(r.route) })).filter(x => x.m);
  if(!rijen.length) return card("Gemeten afstanden — kaart tegenover werkelijkheid",
    `Zodra je bij een rit de km-stand bij vertrek én bij terugkomst invult, verschijnt hier per bestemming
     wat er in de kaart staat tegenover wat er echt gereden is. Dan hoef je de afstanden niet meer zelf op te meten.`,
    `<div class="p-4 text-sm text-slate-500">Nog geen ritten met beide km-standen ingevuld.</div>`);
  return card("Gemeten afstanden — kaart tegenover werkelijkheid",
    `Uit je eigen ritten, alleen die waarbij beide km-standen zijn ingevuld. Staat er
     <span class="text-red-700 font-bold">rood</span>, dan rijd je verder dan de kaart zegt en reken je te weinig benzine.
     Corrigeer de km dan hierboven — je vult de <b>enkele reis</b> in, dus de helft van de gemeten afstand.`,
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Bestemming</th><th class="text-right">Kaart heen en terug</th>
        <th class="text-right">Werkelijk gemiddeld</th><th class="text-right">Verschil</th>
        <th class="text-right">Ritten</th><th class="text-right">Enkele reis zou moeten zijn</th></tr></thead>
      <tbody>${rijen.map(({r,m}) => {
        const kaart = N(r.km) * heenTerug;
        const pct = kaart > 0 ? (m.gemiddeld - kaart) / kaart * 100 : 0;
        const kleur = !kaart ? "" : pct > 5 ? "text-red-700 font-bold" : pct < -5 ? "text-emerald-800" : "";
        return `<tr><td class="font-bold">${esc(r.route)}</td>
          <td class="text-right">${kaart ? nf(kaart) + " km" : "—"}</td>
          <td class="text-right font-black ${kleur}">${nf(m.gemiddeld)} km</td>
          <td class="text-right ${kleur}">${kaart ? (pct>0?"+":"") + nf(pct,0) + "%" : "—"}</td>
          <td class="text-right">${m.ritten}</td>
          <td class="text-right">${nf(m.gemiddeld / heenTerug)} km</td></tr>`;
      }).join("")}</tbody></table></div>`);
}

function viewZonetarieven(){
  const fx = N(A().fxUsd);
  return kaartGemetenAfstanden() + card("Zonetarieven — prijskaart",
    `Je vult de prijs in <b>USD</b> in. De SRD-prijs rekent de app zelf uit: USD × ${nf(fx,2)}, afgerond op 5.
     Wijzig je de koers bij Assumptions, dan klopt de hele lijst meteen weer. Ritten die al zijn ingevoerd veranderen <b>niet</b> mee.<br>
     De <b>km is de enkele reis</b> — de afstand naar de bestemming. Bij een rit en in de Calculator wordt dat automatisch × ${nf(Math.max(N(A().roundTrip),1))} gerekend, want de bus rijdt heen en terug.`,
    `<div class="scroll"><table class="tbl">

/* ---------- Brandstof ----------

   Werkelijk verbruik meten uit de tankbeurten.
   Methode: per bus alle tankbeurten mét km-stand op volgorde zetten. De afstand tussen
   de eerste en de laatste km-stand deel je door de liters van alle beurten BEHALVE de
   eerste — die eerste tank zat er al in toen je begon te meten. Zo blijft de uitkomst
   kloppen ook als je een keer niet helemaal hebt volgetankt.
   Hoe meer tankbeurten, hoe betrouwbaarder het getal. */
function verbruikGemeten(busNaam){
  const lijst = S.brandstof
    .filter(f => f.bus === busNaam && N(f.kmStand) > 0 && N(f.liters) > 0)
    .sort((a,b) => N(a.kmStand) - N(b.kmStand));
  if(lijst.length < 2) return { genoeg:false, beurten:lijst.length };
  const km     = N(lijst[lijst.length-1].kmStand) - N(lijst[0].kmStand);
  const liters = lijst.slice(1).reduce((a,f) => a + N(f.liters), 0);
  if(km <= 0 || liters <= 0) return { genoeg:false, beurten:lijst.length };
  return { genoeg:true, beurten:lijst.length, km, liters, kmPerLiter: km / liters,
           van:N(lijst[0].kmStand), tot:N(lijst[lijst.length-1].kmStand) };
}

/* verbruik van één tankbeurt: de km sinds de vorige beurt van diezelfde bus */
function verbruikBeurt(r){
  if(!N(r.kmStand) || !N(r.liters)) return null;
  const vorige = S.brandstof
    .filter(f => f.bus === r.bus && N(f.kmStand) > 0 && N(f.kmStand) < N(r.kmStand))
    .sort((a,b) => N(b.kmStand) - N(a.kmStand))[0];
  if(!vorige) return null;
  const km = N(r.kmStand) - N(vorige.kmStand);
  return km > 0 ? { km, kmPerLiter: km / N(r.liters) } : null;
}

/* wat de app voor deze bus aanneemt, uit Voertuigklassen */
const verbruikAangenomen = busNaam => { const c = klasseVan(klasseVanBus(busNaam)); return c ? N(c.verbruik) : 0; };

/* gemeten verbruik per klasse — gemiddelde over de bussen in die klasse waar genoeg data van is */
function verbruikGemetenKlasse(klasseKey){
  const metingen = S.buses.filter(b => b.klasseKey === klasseKey)
    .map(b => ({ naam:b.naam, m:verbruikGemeten(b.naam) })).filter(x => x.m.genoeg);
  if(!metingen.length) return null;
  const totKm = metingen.reduce((a,x) => a + x.m.km, 0);
  const totL  = metingen.reduce((a,x) => a + x.m.liters, 0);
  return { kmPerLiter: totKm / totL, bussen: metingen.map(x => x.naam) };
}

        const rij = maanden.map(m => perBusMaand(b.naam, m));
        return `<tr><td class="font-bold">${esc(b.naam)}</td>
          ${rij.map(v => `<td class="text-right">${v ? nf(v) : "<span class='text-slate-300'>—</span>"}</td>`).join("")}
          <td class="text-right font-bold">${nf(rij.reduce((a,v)=>a+v,0))}</td></tr>`;
      }).join("")}</tbody>
      <tfoot><tr><td class="font-black">Alle bussen samen</td>
        ${maanden.map(m => `<td class="text-right font-black">${nf(maandTotaal(m))}</td>`).join("")}
        <td class="text-right font-black">${nf(maanden.reduce((a,m)=>a+maandTotaal(m),0))}</td></tr></tfoot>
    </table></div>`);

  return `

    `Dit rekent de app uit je eigen tankbeurten: de afstand tussen je eerste en je laatste km-stand,
     gedeeld door de liters die je daarna hebt getankt. <b>Vul dus bij elke tankbeurt de km-stand in</b> — je chauffeurs
     sturen die toch al door. Vanaf twee tankbeurten verschijnt hier een getal, en hoe meer beurten hoe betrouwbaarder.<br>
     Staat er <span class="text-red-700 font-bold">rood</span>, dan rijdt de bus zuiniger op papier dan in het echt:
     de app rekent je benzine te goedkoop en je ritprijzen zijn dan te laag. Pas het getal aan bij <b>Voertuigklassen</b>.`,
    `<div class="scroll"><table class="tbl">

      { kop:"Liters", klasse:"text-right", cel:r=>nf(r.liters,1) },

function brandstofModal(r, isNieuw){

    { naam:"liters", label:"Liters", type:"number", waarde: r.liters, attr:'step="0.01"' },

    { naam:"totaal", label:"Totaal SRD", type:"number", waarde: r.totaal, attr:'step="0.01"', hint:"Laat je liters en prijs invullen, dan rekent de app dit uit." },

    { naam:"opmerking", label:"Opmerking", type:"textarea", waarde: r.opmerking },
  ], v => {

    const doel = isNieuw ? { id:"F-" + String(S.counters.brandstof++).padStart(3,"0") } : S.brandstof.find(x=>x.id===r.id);
    Object.assign(doel, { datum:v.datum, bus:v.bus, kmStand:N(v.kmStand), liters:N(v.liters), prijsLiter:N(v.prijsLiter),
      totaal:N(v.totaal), betaaldVia:v.betaaldVia, opmerking:v.opmerking });
    if(isNieuw) S.brandstof.push(doel);
    logMut(isNieuw?"toegevoegd":"gewijzigd","brandstof",`${v.bus} SRD ${nf(v.totaal)}`);
  });
  setTimeout(() => {
    const f = $("#modal-form"); if(!f) return;
    const reken = () => { const t = N(f.liters.value) * N(f.prijsLiter.value); if(t > 0) f.totaal.value = Math.round(t*100)/100; };
    /* de coasters rijden op diesel, de rest op benzine — de prijs volgt dus de bus */
    const volgBus = (overschrijf) => {
      const soort = brandstofSoort(klasseVanBus(f.bus.value));
      const prijs = busBrandstofPrijs(f.bus.value);
      const h = f.querySelector('[data-hint="prijsLiter"]');
      if(h) h.innerHTML = `${f.bus.value || "Deze bus"} rijdt op <b>${soort}</b> — SRD ${nf(prijs,2)} per liter volgens Assumptions.
                           Stond er iets anders op de bon? Typ het gewoon over.`;
      if(overschrijf && prijs > 0) { f.prijsLiter.value = prijs; reken(); }
    };
    f.liters.addEventListener("input", reken);
    f.prijsLiter.addEventListener("input", reken);
    f.bus.addEventListener("change", () => volgBus(true));
    volgBus(isNieuw);
  }, 0);
}

/* ---------- Kasboek ---------- */
let kasValuta = "SRD";

/* een handmatige regel die op hetzelfde bedrag en ongeveer dezelfde dag uitkomt
   als een automatische regel, is bijna zeker per ongeluk dubbel ingevoerd */
/* Waarschuwen voor een dubbele regel mag alleen als het écht om hetzelfde gaat.
   Zelfde bedrag is niet genoeg — twee bussen tanken makkelijk voor hetzelfde geld.
   Daarom moet óók de bus of de chauffeursnaam in jouw eigen omschrijving staan. */
function lijktDubbel(e, alle){
  if(e.auto) return null;
  const bedrag = N(e.uit) || N(e.in);
  if(!bedrag) return null;
  const tekst = norm(e.omschrijving) + " " + norm(e.opmerking);
  return alle.find(x => {
    if(!x.auto) return false;
    if((N(x.uit) || N(x.in)) !== bedrag) return false;
    if(Math.abs((new Date(x.datum) - new Date(e.datum)) / 86400000) > 3) return false;
    /* een chauffeursuitbetaling: de naam moet erin staan */
    if(x.wie) return norm(x.wie).length > 2 && tekst.includes(norm(x.wie));
    /* kosten aan een bus: dezelfde soort kosten én dezelfde bus */
    if(!x.bus) return false;
    if(norm(x.categorie) !== norm(e.categorie)) return false;
    return tekst.includes(norm(x.bus));
  }) || null;
}

function viewKasboek(){
  const alle = alleKasRegels();
  const regels = alle.filter(e => (e.valuta || "SRD") === kasValuta);

  /* saldo op volgorde van datum uitrekenen, daarna omdraaien zodat het nieuwste bovenaan staat */
  let saldo = N((S.kasboek.begin || {})[kasValuta]);
  const metSaldo = regels.map(e => { saldo = cent(saldo + N(e.in) - N(e.uit)); return Object.assign({}, e, { saldo }); });
  const dubbels = metSaldo.map(e => lijktDubbel(e, alle)).filter(Boolean);

  const rijen = metSaldo.slice().reverse().map(e => {
    const dub = lijktDubbel(e, alle);
    return `<tr class="${e.auto ? "auto-row" : ""}" ${dub ? 'style="background:#fef2f2"' : ""}>
      <td class="whitespace-nowrap">${dmy(e.datum)}</td>
      <td>${esc(e.omschrijving)} ${e.auto ? `<span class="pill bg-slate-200 text-slate-600">← ${esc(e.bron)}</span>` : ""}
        ${dub ? `<div class="text-[11.5px] text-red-700 font-bold mt-0.5">⚠ Lijkt dubbel met de automatische regel
          "${esc(dub.omschrijving)}" van ${dmy(dub.datum)} — als dat dezelfde betaling is, wis deze handmatige regel.</div>` : ""}</td>
      <td>${esc(e.categorie || "")}</td>
      <td class="text-right text-emerald-800">${N(e.in) ? nf(e.in, 2) : ""}</td>
      <td class="text-right text-red-700">${N(e.uit) ? nf(e.uit, 2) : ""}</td>
      <td class="text-right font-bold">${nf(e.saldo, 2)}</td>
      <td class="whitespace-nowrap">${e.auto ? `<span class="text-[11px] text-slate-400">automatisch</span>`
        : `<button class="text-emerald-700 font-bold text-xs" data-act="kas-bewerk" data-id="${e.id}">bewerken</button> ·
           <button class="text-red-600 font-bold text-xs" data-act="kas-wis" data-id="${e.id}">wis</button>`}</td></tr>`;
  }).join("");

  return `
  <div class="grid gap-3 sm:grid-cols-3">
    ${["SRD","USD","EUR"].map(v => stat("Saldo " + v, v + " " + nf(kasSaldo(v),2), "beginsaldo " + nf((S.kasboek.begin||{})[v],2))).join("")}
  </div>

  ${dubbels.length ? `<div class="bg-red-600 text-white font-bold rounded-xl px-4 py-3 text-sm">
     ⚠ ${dubbels.length} handmatige regel${dubbels.length>1?"s staan":" staat"} waarschijnlijk dubbel — hieronder rood gemarkeerd.
     De app boekt brandstof, onderhoud en chauffeursuitbetalingen zelf al; je hoeft ze hier niet nog eens in te typen.</div>` : ""}

  ${card("Kasboek",
    `Alleen echt geld, <b>nieuwste bovenaan</b>. Grijze regels komen automatisch uit de bron en pas je daar aan.
     <b>In:</b> wat je van TTG ontvangt — die zet je hier zelf als regel neer, zoals je gewend bent.
     <b>Uit:</b> brandstof, onderhoud en servicebeurten vanaf ${dmy(A().autoKasVanaf)}, en de chauffeursuitbetalingen.
     Schoonmaak niet — dat zit in de uitbetaling van je chauffeur.
     Ritten staan hier <b>niet</b> in — dat is omzet, geen kas. Wat Borger voorschiet, of wat in een chauffeursuitbetaling zit,
     gaat hier niet apart vanaf.`,
    `<div class="p-3 flex gap-2 flex-wrap items-center border-b border-slate-100">
       ${["SRD","USD","EUR"].map(v=>`<button class="btn ${kasValuta===v?"btn-y":"btn-w"}" data-act="kas-valuta" data-v="${v}">${v}</button>`).join("")}
       <label class="text-xs font-bold text-slate-600 ml-3">Beginsaldo ${kasValuta}
         ${inputCel(`kasboek.begin.${kasValuta}`, (S.kasboek.begin||{})[kasValuta], "number", 'style="max-width:130px;display:inline-block" step="0.01"')}</label>
     </div>
     <div class="scroll"><table class="tbl">
       <thead><tr><th>Datum</th><th>Omschrijving</th><th>Categorie</th><th class="text-right">In</th><th class="text-right">Uit</th><th class="text-right">Saldo</th><th></th></tr></thead>
       <tbody>${rijen || `<tr><td colspan="7" class="text-center text-slate-500 py-6">Nog geen mutaties in ${kasValuta}.</td></tr>`}</tbody>
     </table></div>`,
    knop("kas-nieuw","+ Handmatige regel"))}`;
