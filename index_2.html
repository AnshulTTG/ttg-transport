<style>
  html, body { margin:0; padding:0; }
  body { background:#052e1b; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .inp { background:#fefce8; border:1px solid #d6d3d1; border-radius:6px; padding:4px 8px; width:100%; font-size:13px; color:#0f172a; }
  .inp:focus { outline:2px solid #f59e0b; outline-offset:-1px; }
  .inp[readonly], .inp:disabled { background:#f1f5f9; color:#475569; }
  .btn { border-radius:8px; font-weight:700; font-size:13px; padding:7px 14px; display:inline-flex; align-items:center; gap:6px; }
  .btn-y { background:#f0b429; color:#0b3d24; }
  .btn-y:hover { background:#e0a51f; }
  .btn-w { background:rgba(255,255,255,.9); color:#052e1b; }
  .btn-r { background:#dc2626; color:#fff; }
  .btn-g { background:#065f46; color:#fff; }
  table.tbl { width:100%; border-collapse:collapse; font-size:13px; }
  table.tbl th { background:#0b3d24; color:#fff; text-align:left; padding:8px 10px; font-size:11px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  table.tbl td { border-bottom:1px solid #e2e8f0; padding:6px 10px; vertical-align:middle; }
  table.tbl tr:nth-child(even) td { background:#f8fafc; }
  .card { background:#fff; border-radius:14px; box-shadow:0 10px 30px rgba(0,0,0,.25); overflow:hidden; }
  .card-h { background:#0b3d24; color:#fff; padding:12px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .card-n { background:#ecfdf5; color:#065f46; font-size:12px; padding:8px 16px; border-bottom:1px solid #d1fae5; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; display:inline-block; }
  .scroll { overflow-x:auto; }
  .auto-row td { background:#f1f5f9 !important; color:#475569; font-style:italic; }
  @media print {
    body * { visibility:hidden; }
    #ttg-print, #ttg-print * { visibility:visible; }
    #ttg-print { position:absolute; left:0; top:0; width:100%; box-shadow:none !important; }
  }
</style>

const dmy = iso => { if(!iso) return ""; const p=String(iso).slice(0,10).split("-"); return p.length===3 ? `${p[2]}-${p[1]}-${p[0]}` : iso; };
const daysUntil = iso => { if(!iso) return null; const d=new Date(iso+"T00:00:00"); const t=new Date(todayISO()+"T00:00:00"); return Math.round((d-t)/86400000); };
const addMonths = (iso, m) => { const d=new Date(iso+"T00:00:00"); d.setMonth(d.getMonth()+m); return d.toISOString().slice(0,10); };
const uid = p => p + "-" + Math.random().toString(36).slice(2,8).toUpperCase();

/* ---------- migratie van v3 naar v4 ---------- */
const MIGRATIE_RAPPORT = [];
function migreer(oud){
  const s = defaultState();
  if(!oud || typeof oud !== "object") return s;
  const R = (t) => MIGRATIE_RAPPORT.push(t);

  /* assumptions */
  Object.assign(s.assumptions, oud.assumptions || {});
  s.assumptions.autoKasVanaf = (oud.assumptions && oud.assumptions.autoKasVanaf) || AUTO_KAS_VANAF;
  if(s.assumptions.autoKasRitten === undefined) s.assumptions.autoKasRitten = true;
  if(!s.assumptions.serviceIntervalKm) s.assumptions.serviceIntervalKm = 5000;
  if(!s.assumptions.serviceWaarschuwKm) s.assumptions.serviceWaarschuwKm = 500;
  s.assumptions.prijsFormule = "vast";

  /* klassen — oude namen naar de 4 vaste keys */
  const keyVanNaam = naam => {
    const t = norm(naam);
    if(t.includes("sedan")) return "sedan";
    if(t.includes("minivan") || t.includes("voxy") || t.includes("noah")) return "voxy";
    if(t.includes("minibus") || t.includes("hiace") || t.includes("pitbull") || t.includes("busje")) return "hiace";
    if(t.includes("coaster") || t.includes("groot")) return "coaster";
    return "";
  };
  if(Array.isArray(oud.classes)) {
    oud.classes.forEach(oc => {
      const k = keyVanNaam(oc.naam) || keyVanNaam(oc.key);
      const doel = s.classes.find(c => c.key === k);
      if(doel) ["seats","verbruik","purchaseUsd","insurance","keuring","serviceCost","interval","factor"].forEach(f => {
        if(oc[f] !== undefined && oc[f] !== "") doel[f] = oc[f];
      });
    });
    /* Hiace is 8-12, niet 14 */
    const h = s.classes.find(c=>c.key==="hiace"); if(h && N(h.seats) > 12) h.seats = 12;
  }
  if(oud.serviceBuild && Array.isArray(oud.serviceBuild.items)) {
    const standaard = ["lucht filter","smeer olie filter","smeer olie motorolie","arbeidsloon"];
    const blijft = [], verhuist = [];
    oud.serviceBuild.items.forEach(it => {
      (standaard.includes(norm(it.naam)) ? blijft : verhuist).push(it);
    });
    if(blijft.length) s.serviceBuild.items = blijft;
    s.serviceBuild.interval = oud.serviceBuild.interval || 5000;
    verhuist.forEach((it,i) => {
      s.onderhoud.push({
        id:"OH-M"+(i+1), datum: todayISO(), bus:"", type:"Onderhoud",
        werk: it.naam, garage:"", kmStand:"", kosten: N(it.kosten), betaaldVia:"Kas",
        opmerking:"Overgezet vanuit de oude tab 'Onderhoud kosten'"
      });
    });
    if(verhuist.length) R(`${verhuist.length} regel(s) uit de oude tab 'Onderhoud kosten' verplaatst naar 'Onderhoud & Reparaties' (samen SRD ${nf(verhuist.reduce((a,b)=>a+N(b.kosten),0))}).`);
  }

  /* routes: nieuwe prijskaart is leidend; onbekende eigen routes blijven onderaan staan */
  const nieuwNamen = new Set(s.routes.map(r => norm(r.route)));
  let extra = 0;
  (oud.routes || []).forEach(or => {
    if(nieuwNamen.has(norm(or.route))) return;
    extra++;
    const usd={}, pay={}; KKEYS.forEach(k => { usd[k]=""; pay[k]=""; });
    s.routes.push({ id:"RX"+extra, route: or.route, km: or.km, usd, pay, retour:false, overnights: N(or.overnights) });
  });
  if(extra) R(`${extra} eigen route(s) uit de oude Zonetarieven bewaard (zonder prijs — vul zelf aan).`);

  /* oude chauffeurskaart: busje->sedan, hiace->voxy, coaster->hiace, groot->coaster */
  const oudeMap = { busje:"sedan", hiace:"voxy", coaster:"hiace", groot:"coaster" };
  let payOver = 0;
  (oud.chauffeurPay || []).forEach(cp => {
    const kaart = norm(cp.bestemming);
    let doel = s.routes.find(r => norm(r.route) === kaart);
    if(!doel && kaart.length >= 4) {
      /* naam van de kaart zit in de route, of andersom — pak de dichtstbijzijnde */
      const kandidaten = s.routes.filter(r => {
        const rn = norm(r.route);
        return rn.length >= 4 && (rn.includes(kaart) || kaart.includes(rn));
      });
      kandidaten.sort((a,b) => Math.abs(norm(a.route).length - kaart.length) - Math.abs(norm(b.route).length - kaart.length));
      doel = kandidaten[0];
    }
    if(!doel) {
      const usd={}, pay={}; KKEYS.forEach(k=>{usd[k]="";});
      Object.entries(oudeMap).forEach(([o,nkey]) => pay[nkey] = cp[o]);
      if(KKEYS.some(k => N(pay[k]) > 0)) { s.routes.push({ id:uid("RP"), route: cp.bestemming, km:"", usd, pay, retour:false, overnights:0 }); payOver++; }
      return;
    }
    Object.entries(oudeMap).forEach(([o,nkey]) => { if(cp[o] !== "" && cp[o] != null && N(cp[o]) > 0) doel.pay[nkey] = cp[o]; });
  });
  if(payOver) R(`${payOver} chauffeurspay-rij(en) zonder prijskaart-tegenhanger toegevoegd als eigen bestemming.`);

  /* bussen */
  if(Array.isArray(oud.buses) && oud.buses.length) {
    s.buses = oud.buses.map(b => ({
      id: b.id || uid("B"), naam: b.naam, klasseKey: keyVanNaam(b.klasse) || keyVanNaam(b.merk) || "voxy",
      kenteken: b.kenteken||"", merk: b.merk||"", bouwjaar: b.bouwjaar||"", status: b.status||"Actief",
      aankoopUsd: N(b.aankoopUsd),
      peilKm: N(b.huidigeKm !== undefined ? b.huidigeKm : b.peilKm),
      peilDatum: b.peilDatum || todayISO(),
      opmerking: b.opmerking || ""
    }));
    R(`${s.buses.length} bus(sen) overgenomen; de km-stand van vandaag is als beginstand vastgezet op ${dmy(todayISO())}.`);
  }

  /* records 1-op-1 over */
  s.ritten     = (oud.ritten || []).map(r => Object.assign({}, r, {
    km: N(r.km), dagen: N(r.dagen) || 1, telefoon: r.telefoon || "",
    status: r.status || "Uitgevoerd", betaaldVia: r.betaaldVia || "Kas"
  }));
  s.brandstof  = (oud.brandstof  || []).slice();
  s.schoonmaak = (oud.schoonmaak || []).slice();
  s.verzekeringen = (oud.verzekeringen || []).slice();
  s.serviceBeurten = (oud.serviceBeurten || []).map(sb => ({ ...sb, intervalKm: N(sb.intervalKm) || 5000 }));
  s.invoices   = (oud.invoices   || []).map(iv => ({ ...iv, signed: "Ramlal Anshul" }));
  s.users      = (oud.users      || s.users).slice();
  if(oud.kasboek) s.kasboek = { begin: Object.assign({SRD:0,EUR:0,USD:0}, oud.kasboek.begin||{}), entries: (oud.kasboek.entries||[]).slice() };
  s.counters   = Object.assign(s.counters, oud.counters || {});
  s.log        = (oud.log || []).slice();

  /* oude reparaties -> onderhoud (verplaatsen, niet kopiëren) */
  const rep = oud.reparaties || [];
  const oudTotaal = rep.reduce((a,b)=>a+N(b.kosten),0);
  rep.forEach(p => s.onderhoud.push({
    id: p.id || uid("OH"), datum: p.datum, bus: p.bus, type: p.categorie || "Reparatie",
    werk: p.werk || "", garage: p.garage || "", kmStand: p.kmStand || "", kosten: N(p.kosten),
    betaaldVia: p.betaaldVia || "Kas", opmerking: p.opmerking || ""
  }));
  if(Array.isArray(oud.onderhoud)) oud.onderhoud.forEach(o => s.onderhoud.push(o));
  if(rep.length) {
    const nieuwTotaal = s.onderhoud.filter(o => o.opmerking !== "Overgezet vanuit de oude tab 'Onderhoud kosten'").reduce((a,b)=>a+N(b.kosten),0);
    R(`${rep.length} reparatie(s) verplaatst naar 'Onderhoud & Reparaties'. Totaal vóór: SRD ${nf(oudTotaal)} · totaal ná: SRD ${nf(nieuwTotaal)} ${oudTotaal===nieuwTotaal?"✓ gelijk":"⚠ controleer"}.`);
  }
  return s;
}

/* ============================================================
   Opslag (server) + login
   ============================================================ */
let S = null;            // de complete state
let USER = null;         // ingelogde gebruiker
let TAB = "dashboard";
let saveTimer = null, saving = false, saveFout = "";

const token = () => localStorage.getItem("ttg-token");

async function api(pad, opties={}) {
  const h = Object.assign({ "Content-Type":"application/json" }, opties.headers||{});
  if(token()) h.Authorization = "Bearer " + token();
  const r = await fetch(pad, Object.assign({}, opties, { headers:h }));
  return r;
}

async function laadState(){
  const r = await api("/api/state");
  if(r.status === 401) { localStorage.removeItem("ttg-token"); return null; }
  if(r.status === 404) return defaultState();
  if(!r.ok) throw new Error("State ophalen mislukt");
  const data = await r.json();
  return (data && data.versie === 4) ? data : migreer(data);
}

function bewaar(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    saving = true; saveFout = ""; tekenStatus();
    try {
      const r = await api("/api/state", { method:"PUT", body: JSON.stringify(S) });
      if(!r.ok) throw new Error("opslaan mislukt");
    } catch(e) { saveFout = "Niet opgeslagen — controleer je internet"; }
    saving = false; tekenStatus();
  }, 700);
}

function tekenStatus(){
  const el = $("#opslag-status");
  if(!el) return;
  el.textContent = saveFout ? "⚠ " + saveFout : (saving ? "Opslaan…" : "Alles opgeslagen");
  el.className = "text-xs " + (saveFout ? "text-red-300 font-bold" : "text-emerald-200/70");
}

/* logboek van mutaties (max 500) */
function logMut(soort, wat, detail){
  if(!S.log) S.log = [];
  S.log.unshift({ t:new Date().toISOString(), datum: todayISO(), wie: USER ? USER.naam : "?", soort, wat, detail: detail||"" });
  if(S.log.length > 500) S.log.length = 500;
}

/* ============================================================
   Berekeningen
   ============================================================ */
const A = () => S.assumptions;
const busVan = naam => S.buses.find(b => b.naam === naam);
const klasseVanBus = naam => { const b = busVan(naam); return b ? b.klasseKey : ""; };
const klasseLabel = k => (KLASSEN.find(x=>x.key===k)||{}).label || "—";
const routeVan = naam => S.routes.find(r => norm(r.route) === norm(naam));

/* prijs van een route in een klasse */
function tariefVan(routeNaam, klasseKey){
  const r = routeVan(routeNaam);
  if(!r || !klasseKey) return { usd:"", srd:"", km:"", pay:"", bron:"Geen bestemming gevonden" };
  const usd = r.usd[klasseKey];
  const srd = (usd === "" || usd == null) ? "" : round5(N(usd) * N(A().fxUsd));
  const pay = r.pay[klasseKey];
  return {
    usd: usd === "" || usd == null ? "" : N(usd),
    srd, km: r.km, pay: (pay === "" || pay == null) ? "" : N(pay),
    bron: `${r.route} · ${klasseLabel(klasseKey)}`
  };
}

/* km van gereden ritten van een bus vanaf een datum (geplande ritten tellen niet mee) */
function ritKmVanaf(busNaam, vanaf){
  return S.ritten
    .filter(r => r.bus === busNaam && r.status !== "Gepland" && r.datum >= (vanaf || "0000-00-00"))
    .reduce((a, r) => a + N(r.km), 0);
}

/* huidige km-stand: beginstand + de km van de ritten vanaf de peildatum */
function huidigeKm(bus){
  const b = typeof bus === "string" ? busVan(bus) : bus;
  if(!b) return 0;
  return N(b.peilKm) + ritKmVanaf(b.naam, b.peilDatum);
}

/* laatste servicebeurt van een bus */
function laatsteService(busNaam){
  return S.serviceBeurten
    .filter(sb => sb.bus === busNaam && sb.status === "Geserviced")
    .sort((a,b) => a.datum > b.datum ? -1 : 1)[0] || null;
}

/* reminder per bus: service-km, service-datum, verzekering, keuring */
function reminders(){
  const waarschuw = N(A().serviceWaarschuwKm) || 500;
  return S.buses.map(b => {
    const meldingen = [];
    let toon = "green";
    const zet = t => { const rang = {green:0, amber:1, red:2}; if(rang[t] > rang[toon]) toon = t; };
    const km = huidigeKm(b.naam);

    /* service op km */
    const sb = laatsteService(b.naam);
    if(sb && N(sb.kmStand) > 0) {
      const interval = N(sb.intervalKm) || N(A().serviceIntervalKm) || 5000;
      const volgende = N(sb.kmStand) + interval;
      const over = volgende - km;
      if(over <= 0) { zet("red"); meldingen.push(`SERVICEBEURT NODIG — ${nf(Math.abs(over))} km over het interval (was nodig bij ${nf(volgende)} km, nu ${nf(km)} km)`); }
      else if(over <= waarschuw) { zet("amber"); meldingen.push(`nog ${nf(over)} km tot de servicebeurt (bij ${nf(volgende)} km)`); }
      else meldingen.push(`nog ${nf(over)} km tot de servicebeurt (bij ${nf(volgende)} km)`);
    } else {
      zet("amber"); meldingen.push("nog geen servicebeurt met km-stand — vul die in bij Servicebeurt");
    }

    /* service op datum */
    if(sb && sb.volgendeDatum) {
      const d = daysUntil(sb.volgendeDatum);
      if(d < 0) { zet("red"); meldingen.push(`datum-service was ${dmy(sb.volgendeDatum)} — OVERTIJD`); }
      else if(d <= 30) { zet("amber"); meldingen.push(`datum-service op ${dmy(sb.volgendeDatum)} (over ${d} dgn)`); }
    }

    /* verzekering en keuring */
    const vz = S.verzekeringen.find(v => v.bus === b.naam);
    const check = (datum, wat) => {
      if(!datum) return;
      const d = daysUntil(datum);
      if(d < 0)       { zet("red");   meldingen.push(`${wat} is VERLOPEN sinds ${dmy(datum)} — bus niet inzetbaar`); }
      else if(d <= 7) { zet("red");   meldingen.push(`${wat} vervalt over ${d} dg op ${dmy(datum)}`); }
      else if(d <= 30){ zet("amber"); meldingen.push(`${wat} vervalt over ${d} dgn op ${dmy(datum)}`); }
    };
    if(vz) { check(vz.verzVervalt, "Verzekering"); check(vz.keurVervalt, "Keuring"); }
    else { zet("amber"); meldingen.push("geen verzekering/keuring vastgelegd"); }

    return { bus: b.naam, toon, km, meldingen };
  });
}

function busNietInzetbaar(busNaam){
  const vz = S.verzekeringen.find(v => v.bus === busNaam);
  if(!vz) return false;
  return (vz.verzVervalt && daysUntil(vz.verzVervalt) < 0) || (vz.keurVervalt && daysUntil(vz.keurVervalt) < 0);
}

/* ============================================================
   Kasboek — handmatige regels + automatische regels uit de bron
   ============================================================ */
function autoKasRegels(){
  const vanaf = A().autoKasVanaf || AUTO_KAS_VANAF;
  const uit = [];
  const voeg = (bron, id, datum, oms, categorie, inBedrag, uitBedrag, valuta) => {
    if(!datum || datum < vanaf) return;
    uit.push({ id: bron+":"+id, auto:true, bron, bronId:id, datum, omschrijving:oms,
               categorie, valuta: valuta||"SRD", in:inBedrag, uit:uitBedrag, opmerking:"" });
  };
  S.brandstof.forEach(f => voeg("Brandstof", f.id, f.datum, `${f.bus||"—"} — brandstof ${f.liters?nf(f.liters)+" l":""} ${f.station?"("+f.station+")":""}`.trim(), "Brandstof", 0, N(f.totaal)));
  S.onderhoud.forEach(o => voeg("Onderhoud", o.id, o.datum, `${o.bus||"—"} — ${o.type||"Onderhoud"}: ${o.werk||""}`.trim(), "Onderhoud", 0, N(o.kosten)));
  S.schoonmaak.forEach(w => voeg("Schoonmaak", w.id, w.datum, `${w.bus||"—"} — schoonmaak ${w.soort||""}`.trim(), "Schoonmaak", 0, N(w.kosten)));
  S.serviceBeurten.filter(sb => sb.status === "Geserviced")
    .forEach(sb => voeg("Servicebeurt", sb.id, sb.datum, `${sb.bus||"—"} — servicebeurt`, "Servicebeurt", 0, N(sb.kosten)));
  if(A().autoKasRitten) {
    S.ritten.filter(r => r.status === "Betaald")
      .forEach(r => voeg("Rit", r.id, r.datum, `Rit ${r.bestemming||""} — ${r.klant||""}`.trim(), "Rit-inkomst", N(r.tariefSrd), 0));
    S.ritten.filter(r => r.status === "Betaald" && N(r.chauffeurPay) > 0)
      .forEach(r => voeg("Chauffeur", r.id, r.datum, `Chauffeur betaald — ${r.bestemming||""}`, "Chauffeur", 0, N(r.chauffeurPay)));
  }
  return uit;
}

function alleKasRegels(){
  const hand = (S.kasboek.entries || []).map(e => Object.assign({ auto:false }, e));
  return hand.concat(autoKasRegels()).sort((a,b) => (a.datum === b.datum) ? (a.id > b.id ? 1 : -1) : (a.datum > b.datum ? 1 : -1));
}

function kasSaldo(valuta){
  const begin = N((S.kasboek.begin||{})[valuta]);
  return alleKasRegels().filter(e => (e.valuta||"SRD") === valuta)
    .reduce((a,e) => a + N(e.in) - N(e.uit), begin);
}

/* maand-cijfers */
function maandCijfers(maand){
  const inM = arr => arr.filter(x => ym(x.datum) === maand);
  const som = (arr, veld) => arr.reduce((a,x) => a + N(x[veld]), 0);
  const ritten = inM(S.ritten);
  const omzet = som(ritten, "tariefSrd");
  const chauffeurs = som(ritten, "chauffeurPay");
  const brandstof = som(inM(S.brandstof), "totaal");
  const schoonmaak = som(inM(S.schoonmaak), "kosten");
  const onderhoud = som(inM(S.onderhoud), "kosten");
  const service = som(inM(S.serviceBeurten).filter(s => s.status === "Geserviced"), "kosten");
  const verzekering = som(S.verzekeringen, "verzJaar") / 12;
  const keuring = som(S.verzekeringen, "keurJaar") / 12;
  const kosten = chauffeurs + brandstof + schoonmaak + onderhoud + service + verzekering + keuring;
  return { ritten: ritten.length, omzet, chauffeurs, brandstof, schoonmaak, onderhoud, service, verzekering, keuring, kosten, netto: omzet - kosten };
}

/* winst per rit */
function ritWinst(r){
  const b = busVan(r.bus);
  const kl = b ? S.classes.find(c => c.key === b.klasseKey) : null;
  const verbruik = kl ? N(kl.verbruik) : 7;
  const brandstofKost = verbruik > 0 ? (N(r.km) / verbruik) * N(A().petrol) : 0;
  const kosten = N(r.chauffeurPay) + brandstofKost;
  return { brandstofKost, kosten, winst: N(r.tariefSrd) - kosten };
}

/* pad-helpers: "routes.3.usd.sedan" */
function getPad(pad){ return pad.split(".").reduce((o,k) => (o||{})[k], S); }
function setPad(pad, waarde){
  const d = pad.split("."); const laatste = d.pop();
  const doel = d.reduce((o,k) => o[k], S);
  doel[laatste] = waarde;
}

    switch(TAB){
      case "dashboard":      return viewDashboard();
      case "dagboek":        return viewDagboek();
      case "ritten":         return viewRitten();
      case "zonetarieven":   return viewZonetarieven();
      case "chauffeurs":     return viewChauffeurs();

      case "schoonmaak":     return viewSchoonmaak();
      case "onderhoud":      return viewOnderhoud();
      case "service":        return viewService();
      case "verzekering":    return viewVerzekering();
      case "kasboek":        return viewKasboek();
      case "invoices":       return viewInvoices();
      case "maandoverzicht": return viewMaandoverzicht();
      case "terugverdienen": return viewTerugverdienen();

/* ---------- modal ---------- */
let modalOpslaan = null;
function toonModal(titel, velden, opslaan, extraHtml){
  modalOpslaan = opslaan;
  $("#modal-laag").innerHTML = `
   <div class="fixed inset-0 bg-black/60 flex items-start justify-center p-4 overflow-y-auto z-50" data-act="modal-achtergrond">
     <form id="modal-form" class="card w-full max-w-lg my-8" onsubmit="return false;">
       <div class="card-h"><h3 class="font-bold">${titel}</h3><button class="text-white text-xl leading-none" data-act="modal-sluit">×</button></div>
       <div class="p-5 space-y-3">
         ${velden.map(v => veldHtml(v)).join("")}
         ${extraHtml||""}
       </div>
       <div class="p-4 bg-slate-50 flex justify-end gap-2">
         ${knop("modal-sluit","Annuleren","btn-w")}
         ${knop("modal-opslaan","Opslaan","btn-y")}
       </div>
     </form></div>`;
}
function veldHtml(v){
  if(v.type === "kop") return `<div class="text-[11px] font-black uppercase tracking-wider text-emerald-800 pt-2">${v.label}</div>`;
  const naam = `name="${v.naam}"`;
  let veld;
  if(v.type === "select")      veld = `<select class="inp" ${naam}>${v.opties.map(o => { const [w,l]=Array.isArray(o)?o:[o,o];
                                       return `<option value="${esc(w)}" ${String(w)===String(v.waarde)?"selected":""}>${esc(l)}</option>`; }).join("")}</select>`;
  else if(v.type === "textarea") veld = `<textarea class="inp" rows="2" ${naam}>${esc(v.waarde)}</textarea>`;
  else if(v.type === "datalist") veld = `<input class="inp" ${naam} list="${v.naam}-lijst" value="${esc(v.waarde)}" autocomplete="off">
                                         <datalist id="${v.naam}-lijst">${v.opties.map(o=>`<option value="${esc(o)}">`).join("")}</datalist>`;
  else veld = `<input class="inp" type="${v.type||"text"}" ${naam} value="${esc(v.waarde==null?"":v.waarde)}" ${v.attr||""}>`;
  return `<label class="block"><span class="text-xs font-bold text-slate-600">${v.label}</span>${veld}
          ${v.hint?`<span class="block text-[11px] text-slate-500 mt-0.5" data-hint="${v.naam}">${v.hint}</span>`:""}</label>`;
}
function sluitModal(){ $("#modal-laag").innerHTML = ""; modalOpslaan = null; }
function modalWaarden(){
  const f = $("#modal-form"); const o = {};
  if(!f) return o;
  Array.from(f.elements).forEach(el => { if(el.name) o[el.name] = el.value; });
  return o;
}

/* ============================================================
   Dashboard
   ============================================================ */
function viewDashboard(){
  const maand = ym(todayISO());
  const m = maandCijfers(maand);
  const al = reminders();
  const leegPay = S.routes.filter(r => KKEYS.some(k => r.pay[k] === "" || r.pay[k] == null));
  const kasSRD = kasSaldo("SRD");

  return `
  <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    ${stat("Omzet deze maand", "SRD " + nf(m.omzet), `${m.ritten} rit${m.ritten===1?"":"ten"}`)}
    ${stat("Kosten deze maand", "SRD " + nf(m.kosten), "incl. chauffeurs & brandstof", "text-red-700")}
    ${stat("Netto deze maand", "SRD " + nf(m.netto), m.netto>=0?"winst":"verlies", m.netto>=0?"text-emerald-900":"text-red-700")}
    ${stat("Kas SRD", "SRD " + nf(kasSRD), "contant saldo", kasSRD>=0?"text-emerald-900":"text-red-700")}
  </div>

  ${card("🔔 Meldingen per bus",
    "Groen = in orde · Geel = binnenkort actie nodig · Rood = nu actie nodig. Verzekering en keuring melden 30 dagen geel en 7 dagen rood.",
    `<div class="p-4 grid md:grid-cols-2 gap-2">
      ${al.map(a => `<div class="rounded-lg border px-3 py-2.5 text-sm ${toonKleur[a.toon]}">
        <div class="font-bold flex items-center justify-between">
          <span>${a.toon==="red"?"🔴":a.toon==="amber"?"🟡":"🟢"} ${esc(a.bus)} ${busNietInzetbaar(a.bus)?'<span class="pill bg-red-600 text-white ml-1">NIET INZETBAAR</span>':""}</span>
          <span class="text-xs font-normal">${nf(a.km)} km</span></div>
        <ul class="mt-1 space-y-0.5 text-[12.5px]">${a.meldingen.map(t=>`<li>· ${esc(t)}</li>`).join("")}</ul>
      </div>`).join("")}
    </div>`)}

  ${leegPay.length ? card("⚠ Chauffeurspay nog niet ingevuld",
    "Bij deze bestemmingen is nog geen bedrag per klasse ingevuld. Zonder bedrag pakt een rit de standaardfee uit Assumptions.",
    `<div class="p-4 text-sm text-slate-700"><ul class="list-disc pl-5 space-y-0.5">
      ${leegPay.map(r => `<li><b>${esc(r.route)}</b> — leeg bij: ${KKEYS.filter(k=>r.pay[k]===""||r.pay[k]==null).map(k=>klasseLabel(k)).join(", ")}</li>`).join("")}
     </ul></div>`,
     knop("tab","Naar Chauffeurs","btn-y",'data-tab="chauffeurs"')) : ""}

  ${card("Per bus — deze maand", "Omzet, kosten en netto bijdrage per bus.",
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Bus</th><th>Klasse</th><th>Ritten</th><th>Omzet SRD</th><th>Chauffeur</th><th>Brandstof</th><th>Onderhoud</th><th>Netto</th><th>Km-stand</th></tr></thead>
      <tbody>${S.buses.map(b => {
        const rit = S.ritten.filter(r => r.bus === b.naam && ym(r.datum) === maand);
        const omzet = rit.reduce((a,r)=>a+N(r.tariefSrd),0);
        const ch = rit.reduce((a,r)=>a+N(r.chauffeurPay),0);
        const br = S.brandstof.filter(f=>f.bus===b.naam && ym(f.datum)===maand).reduce((a,f)=>a+N(f.totaal),0);
        const oh = S.onderhoud.filter(o=>o.bus===b.naam && ym(o.datum)===maand).reduce((a,o)=>a+N(o.kosten),0)
                 + S.schoonmaak.filter(w=>w.bus===b.naam && ym(w.datum)===maand).reduce((a,w)=>a+N(w.kosten),0)
                 + S.serviceBeurten.filter(s=>s.bus===b.naam && ym(s.datum)===maand && s.status==="Geserviced").reduce((a,s)=>a+N(s.kosten),0);
        const netto = omzet - ch - br - oh;
        return `<tr><td class="font-bold">${esc(b.naam)}</td><td>${klasseLabel(b.klasseKey)}</td><td>${rit.length}</td>
          <td>${nf(omzet)}</td><td>${nf(ch)}</td><td>${nf(br)}</td><td>${nf(oh)}</td>
          <td class="font-bold ${netto>=0?"text-emerald-800":"text-red-700"}">${nf(netto)}</td><td>${nf(huidigeKm(b.naam))}</td></tr>`;
      }).join("")}</tbody></table></div>`)}
  `;
}

/* ============================================================
   Dagboek — wat is er vandaag gebeurd
   ============================================================ */
let dagboekDatum = null;
function viewDagboek(){
  const d = dagboekDatum || todayISO();
  const rit = S.ritten.filter(r => r.datum === d);
  const br  = S.brandstof.filter(x => x.datum === d);
  const sm  = S.schoonmaak.filter(x => x.datum === d);
  const oh  = S.onderhoud.filter(x => x.datum === d);
  const sb  = S.serviceBeurten.filter(x => x.datum === d);
  const kas = alleKasRegels().filter(x => x.datum === d);
  const inSRD  = kas.filter(k=>(k.valuta||"SRD")==="SRD").reduce((a,k)=>a+N(k.in),0);
  const uitSRD = kas.filter(k=>(k.valuta||"SRD")==="SRD").reduce((a,k)=>a+N(k.uit),0);
  const meld = reminders().filter(a => a.toon !== "green");
  const mut = (S.log||[]).filter(l => l.datum === d);

  const blok = (titel, regels) => regels.length ? `<div class="mb-3"><div class="font-bold text-emerald-900 text-sm">${titel}</div>
      <ul class="text-[13px] text-slate-700 pl-4 list-disc space-y-0.5 mt-1">${regels.map(r=>`<li>${r}</li>`).join("")}</ul></div>` : "";

  const tekst = [
    `*TTG Dagboek — ${dmy(d)}*`,
    rit.length ? `Ritten: ${rit.length} · omzet SRD ${nf(rit.reduce((a,r)=>a+N(r.tariefSrd),0))}` : "Ritten: geen",
    br.length  ? `Brandstof: ${br.length} × · SRD ${nf(br.reduce((a,f)=>a+N(f.totaal),0))}` : "",
    oh.length  ? `Onderhoud: ${oh.length} × · SRD ${nf(oh.reduce((a,o)=>a+N(o.kosten),0))}` : "",
    sm.length  ? `Schoonmaak: ${sm.length} × · SRD ${nf(sm.reduce((a,w)=>a+N(w.kosten),0))}` : "",
    sb.length  ? `Servicebeurten: ${sb.length} ×` : "",
    `Kas SRD: +${nf(inSRD)} / -${nf(uitSRD)} → saldo SRD ${nf(kasSaldo("SRD"))}`,
    meld.length ? `Meldingen: ${meld.map(m=>m.bus+" — "+m.meldingen[0]).join(" | ")}` : "Meldingen: geen",
  ].filter(Boolean).join("\n");

  return card(`📔 Dagboek — ${dmy(d)}`,
    "Alles wat op deze dag is ingevoerd of gebeurd. Kies een andere datum om terug te kijken. Met de knop kopieer je een korte samenvatting voor WhatsApp.",
    `<div class="p-4">
      <div class="flex items-end gap-3 flex-wrap mb-4">
        <label class="text-xs font-bold text-slate-600">Datum<input class="inp mt-1" type="date" data-act="dagboek-datum" value="${d}"></label>
        ${knop("dagboek-vandaag","Vandaag","btn-w")}
        ${knop("dagboek-kopieer","📋 Kopieer voor WhatsApp","btn-y")}
      </div>
      <div class="grid md:grid-cols-2 gap-4">
        <div>
          ${blok("Ritten", rit.map(r => `${esc(r.bus)} → <b>${esc(r.bestemming)}</b> · ${esc(r.klant||"")} · SRD ${nf(r.tariefSrd)} · chauffeur ${nf(r.chauffeurPay)} · ${nf(r.km)} km <span class="pill bg-slate-200 text-slate-700">${esc(r.status||"")}</span>`))}
          ${blok("Brandstof", br.map(f => `${esc(f.bus)} · ${nf(f.liters)} l · SRD ${nf(f.totaal)} ${f.station?"("+esc(f.station)+")":""}`))}
          ${blok("Onderhoud & reparaties", oh.map(o => `${esc(o.bus)} · ${esc(o.type)} · ${esc(o.werk)} · SRD ${nf(o.kosten)}`))}
          ${blok("Schoonmaak", sm.map(w => `${esc(w.bus)} · ${esc(w.soort)} · SRD ${nf(w.kosten)}`))}
          ${blok("Servicebeurten", sb.map(x => `${esc(x.bus)} · ${esc(x.status)} · SRD ${nf(x.kosten)} · km ${nf(x.kmStand)}`))}
          ${(!rit.length && !br.length && !oh.length && !sm.length && !sb.length) ? `<div class="text-slate-500 text-sm">Op deze dag is niets ingevoerd.</div>` : ""}
        </div>
        <div>
          <div class="font-bold text-emerald-900 text-sm mb-1">Kasboek deze dag</div>
          ${kas.length ? `<table class="tbl"><thead><tr><th>Omschrijving</th><th>Val.</th><th class="text-right">In</th><th class="text-right">Uit</th></tr></thead>
            <tbody>${kas.map(k => `<tr class="${k.auto?"auto-row":""}"><td>${esc(k.omschrijving)}${k.auto?` <span class="pill bg-slate-200 text-slate-600">← ${esc(k.bron)}</span>`:""}</td>
              <td>${esc(k.valuta||"SRD")}</td><td class="text-right">${N(k.in)?nf(k.in):""}</td><td class="text-right">${N(k.uit)?nf(k.uit):""}</td></tr>`).join("")}</tbody></table>`
            : `<div class="text-slate-500 text-sm">Geen kasmutaties.</div>`}
          <div class="mt-2 text-sm"><b>In:</b> SRD ${nf(inSRD)} · <b>Uit:</b> SRD ${nf(uitSRD)} · <b>Saldo nu:</b> SRD ${nf(kasSaldo("SRD"))}</div>

          <div class="font-bold text-emerald-900 text-sm mt-4 mb-1">Openstaande meldingen</div>
          ${meld.length ? meld.map(m => `<div class="rounded border px-2 py-1.5 text-[12.5px] mb-1 ${toonKleur[m.toon]}"><b>${esc(m.bus)}</b> — ${esc(m.meldingen[0])}</div>`).join("")
                        : `<div class="text-emerald-700 text-sm">Geen — alles in orde.</div>`}

          ${mut.length ? `<div class="font-bold text-emerald-900 text-sm mt-4 mb-1">Wijzigingen door gebruikers</div>
            <ul class="text-[12px] text-slate-600 pl-4 list-disc">${mut.slice(0,25).map(l=>`<li>${esc(l.wie)}: ${esc(l.soort)} ${esc(l.wat)} ${esc(l.detail)}</li>`).join("")}</ul>` : ""}
        </div>
      </div>
      <textarea id="dagboek-tekst" class="hidden">${esc(tekst)}</textarea>
    </div>`);
}

/* ============================================================
   Ritten
   ============================================================ */
let ritZoek = "";
const RIT_STATUS = ["Gepland","Uitgevoerd","Gefactureerd","Betaald"];

function viewRitten(){
  const zoek = norm(ritZoek);
  const lijst = S.ritten
    .filter(r => !zoek || [r.bestemming, r.klant, r.bus].some(v => norm(v).includes(zoek)))
    .sort((a,b) => a.datum > b.datum ? -1 : 1);
  const omzet = lijst.reduce((a,r)=>a+N(r.tariefSrd),0);

  return card("Ritten",
    "Kies bus en bestemming — km, tarief SRD, tarief USD en chauffeurspay worden automatisch ingevuld. Elk veld kun je daarna nog aanpassen (bijvoorbeeld extra chauffeurspay bij wachttijd). De km van de rit tellen op bij de km-stand van de bus.",

        <th class="text-right">Winst</th><th>Status</th><th></th></tr></thead>

          <td>${nf(r.km)}</td>

          <td class="whitespace-nowrap">

/* vult de automatische velden in het rit-formulier */
function ritVulAan(forceer){
  const f = $("#modal-form"); if(!f) return;
  const busNaam = f.bus.value, kl = klasseVanBus(busNaam);
  const t = tariefVan(f.bestemming.value, kl);
  const hint = f.querySelector('[data-hint="bestemming"]');
  if(hint) {
    if(!kl) hint.innerHTML = `<span class="text-red-600 font-bold">Deze bus heeft geen klasse — koppel er één bij Wagenpark.</span>`;
    else if(!routeVan(f.bestemming.value)) hint.innerHTML = `<span class="text-amber-700">Bestemming nog niet in de lijst — vul de bedragen zelf in.</span>`;
    else hint.innerHTML = `Gevonden: <b>${esc(t.bron)}</b>${t.usd===""?' <span class="text-amber-700">(geen prijs ingevuld)</span>':""}${t.pay===""?' <span class="text-amber-700">(geen chauffeurspay ingevuld — standaardfee gebruikt)</span>':""}`;
  }
  const zetAls = (veld, waarde) => {
    if(waarde === "" || waarde == null) return;
    if(forceer || !N(f[veld].value)) f[veld].value = waarde;
  };
  const dagen = Math.max(1, N(f.dagen.value) || 1);
  zetAls("km", t.km === "" ? "" : N(t.km));
  zetAls("tariefUsd", t.usd);
  zetAls("tariefSrd", t.srd);
  const basisPay = t.pay === "" ? N(A().driverFee) : N(t.pay);
  /* meerdaags: pay per dag, tenzij de kaartprijs al voor meerdere dagen geldt */
  const meerdaagsInNaam = /(\d)\s*(dag|day)/i.test(f.bestemming.value || "");
  zetAls("chauffeurPay", meerdaagsInNaam ? basisPay : basisPay * dagen);
}

function ritModal(r, isNieuw){
  toonModal(isNieuw ? "Nieuwe rit" : "Rit bewerken", ritVelden(r), (v) => {
    if(!v.bus)        return "Kies een bus.";
    if(!v.bestemming) return "Vul een bestemming in.";
    const doel = isNieuw ? { id:"RT-" + String(S.counters.rit++).padStart(4,"0") } : S.ritten.find(x => x.id === r.id);
    Object.assign(doel, {
      datum:v.datum, bus:v.bus, bestemming:v.bestemming, dagen:N(v.dagen)||1, klant:v.klant, telefoon:v.telefoon,
      pax:v.pax, km:N(v.km), tariefUsd:N(v.tariefUsd), tariefSrd:N(v.tariefSrd), chauffeurPay:N(v.chauffeurPay),
      status:v.status, betaaldVia:v.betaaldVia, opmerking:v.opmerking
    });
    if(isNieuw) S.ritten.push(doel);
    logMut(isNieuw?"toegevoegd":"gewijzigd", "rit", `${v.bus} → ${v.bestemming}`);
    if(busNietInzetbaar(v.bus)) alert(`Let op: ${v.bus} heeft een verlopen verzekering of keuring.`);
  });
  setTimeout(() => {
    const f = $("#modal-form"); if(!f) return;
    ["bus","bestemming","dagen"].forEach(veld => {
      f[veld].addEventListener("change", () => ritVulAan(true));
      f[veld].addEventListener("input", () => ritVulAan(false));
    });
    if(isNieuw) ritVulAan(true); else ritVulAan(false);
  }, 0);
}

function invoiceTotalen(iv){
  const sub = (iv.items||[]).reduce((a,i) => a + N(i.bus) * N(i.prijs), 0);
  const btw = sub * N(iv.btwPct) / 100;
  const subInc = sub + btw;
  return { sub, btw, subInc, balance: subInc - N(iv.deposit) };
}

      .map(x => ym(x.datum)).filter(Boolean)
  )).sort().reverse().slice(0, 18);
  if(!maanden.length) maanden.push(ym(todayISO()));
  return card("Maandoverzicht", "Alle kosten en opbrengsten per maand. Verzekering en keuring worden per maand toegerekend (jaarbedrag ÷ 12).",
    `<div class="scroll"><table class="tbl">

        <th class="text-right">Service</th><th class="text-right">Verz.+keur.</th><th class="text-right">Kosten</th><th class="text-right">Netto</th></tr></thead>
      <tbody>${maanden.map(m => { const c = maandCijfers(m); const [j,mm] = m.split("-");
        return `<tr><td class="font-bold">${MAAND[N(mm)-1]} ${j}</td><td class="text-right">${c.ritten}</td>
          <td class="text-right">${nf(c.omzet)}</td><td class="text-right">${nf(c.chauffeurs)}</td>
          <td class="text-right">${nf(c.brandstof)}</td><td class="text-right">${nf(c.schoonmaak)}</td>
          <td class="text-right">${nf(c.onderhoud)}</td><td class="text-right">${nf(c.service)}</td>
          <td class="text-right">${nf(c.verzekering + c.keuring)}</td>
          <td class="text-right text-red-700">${nf(c.kosten)}</td>
          <td class="text-right font-black ${c.netto>=0?"text-emerald-800":"text-red-700"}">${nf(c.netto)}</td></tr>`;
      }).join("")}</tbody></table></div>`);
}

function viewTerugverdienen(){
  return card("Bus terugverdienen", "Wat een bus tot nu toe netto heeft opgebracht, afgezet tegen de aankoopprijs.",
    `<div class="scroll"><table class="tbl">
      <thead><tr><th>Bus</th><th class="text-right">Aankoop SRD</th><th class="text-right">Netto tot nu</th>
        <th class="text-right">Nog te gaan</th><th style="min-width:180px">Voortgang</th></tr></thead>
      <tbody>${S.buses.map(b => {
        const aankoop = N(b.aankoopUsd) * N(A().fxUsd);
        const omzet = S.ritten.filter(r=>r.bus===b.naam).reduce((a,r)=>a+N(r.tariefSrd),0);
        const kost = S.ritten.filter(r=>r.bus===b.naam).reduce((a,r)=>a+N(r.chauffeurPay),0)
                   + S.brandstof.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.totaal),0)
                   + S.schoonmaak.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.kosten),0)
                   + S.onderhoud.filter(x=>x.bus===b.naam).reduce((a,x)=>a+N(x.kosten),0)
                   + S.serviceBeurten.filter(x=>x.bus===b.naam && x.status==="Geserviced").reduce((a,x)=>a+N(x.kosten),0);
        const netto = omzet - kost;
        const pct = aankoop > 0 ? Math.max(0, Math.min(100, netto/aankoop*100)) : 0;
        return `<tr><td class="font-bold">${esc(b.naam)}</td><td class="text-right">${nf(aankoop)}</td>
          <td class="text-right ${netto>=0?"text-emerald-800":"text-red-700"}">${nf(netto)}</td>
          <td class="text-right">${nf(Math.max(0, aankoop-netto))}</td>
          <td><div class="bg-slate-200 rounded-full h-3 overflow-hidden"><div class="bg-emerald-600 h-3" style="width:${pct}%"></div></div>
              <div class="text-[11px] text-slate-500 mt-0.5">${nf(pct,1)}%</div></td></tr>`;
      }).join("")}</tbody></table></div>`);
}

/* ============================================================
   Gebeurtenissen
   ============================================================ */
document.addEventListener("input", e => {
  const el = e.target;
  if(el.dataset && el.dataset.bind) {
    const w = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
    setPad(el.dataset.bind, w);
    bewaar();
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if(el.dataset && el.dataset.bind) {
    let w = el.type === "number" ? (el.value === "" ? "" : Number(el.value)) : el.value;
    if(el.dataset.bind === "assumptions.autoKasRitten") w = (el.value === "true");
    setPad(el.dataset.bind, w);
    bewaar();
    if(el.dataset.hertoon || el.tagName === "SELECT" || el.type === "date" || el.dataset.bind.startsWith("assumptions")) render();
  }
  if(el.dataset && el.dataset.act === "dagboek-datum") { dagboekDatum = el.value; render(); }
  if(el.dataset && el.dataset.act === "backup-upload") herstelBackup(el.files[0]);
});

document.addEventListener("keyup", e => {
  if(e.target.dataset && e.target.dataset.act === "rit-zoek") {
    ritZoek = e.target.value;
    const pos = e.target.selectionStart; render();
    const nw = $('[data-act="rit-zoek"]'); if(nw) { nw.focus(); nw.setSelectionRange(pos,pos); }
  }
});

document.addEventListener("submit", async e => {
  if(e.target.id === "login-form") {
    e.preventDefault();
    const f = e.target;
    const r = await fetch("/api/login", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ gebruikersnaam: f.gebruikersnaam.value, pincode: f.pincode.value }) });
    if(!r.ok) { $("#login-fout").textContent = "Onjuiste gebruikersnaam of pincode."; return; }
    const d = await r.json();
    localStorage.setItem("ttg-token", d.token);
    USER = d.user;
    S = await laadState();
    if(S && S.versie !== 4) S = migreer(S);
    bewaar();
    render();
  }
});

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id, i = N(el.dataset.i);
  const vind = (arr) => arr.find(x => x.id === id);
  const wis = (arr, wat) => { const k = arr.findIndex(x => x.id === id); if(k >= 0 && confirm("Deze regel verwijderen?")) {
      logMut("verwijderd", wat, arr[k].id); arr.splice(k,1); bewaar(); render(); } };

  switch(act){
    case "tab": TAB = el.dataset.tab; printId = null; window.scrollTo(0,0); render(); break;
    case "uitloggen": localStorage.removeItem("ttg-token"); USER = null; render(); break;

    /* modal */
    case "modal-sluit": sluitModal(); break;
    case "modal-achtergrond": if(e.target === el) sluitModal(); break;
    case "modal-opslaan": {
      const fout = modalOpslaan ? modalOpslaan(modalWaarden()) : null;
      if(fout) { alert(fout); break; }
      sluitModal(); bewaar(); render(); break;
    }

    /* ritten */
    case "rit-nieuw":   ritModal({}, true); break;
    case "rit-bewerk":  ritModal(vind(S.ritten), false); break;
    case "rit-kopie": { const o = vind(S.ritten);
      ritModal(Object.assign({}, o, { id:undefined, datum: todayISO(), status:"Gepland" }), true); break; }
    case "rit-wis":     wis(S.ritten, "rit"); break;

    /* routes */
    case "route-nieuw": {
      const usd={}, pay={}; KKEYS.forEach(k=>{usd[k]=""; pay[k]="";});
      S.routes.push({ id:uid("R"), route:"Nieuwe bestemming", km:"", usd, pay, retour:false, overnights:0 });
      bewaar(); render(); break; }
    case "route-wis": if(confirm(`"${S.routes[i].route}" verwijderen?`)) { S.routes.splice(i,1); bewaar(); render(); } break;

    /* bussen */
    case "bus-nieuw": S.buses.push({ id:uid("B"), naam:"nieuwe bus", klasseKey:"voxy", kenteken:"", merk:"",
        bouwjaar:"", status:"Actief", aankoopUsd:0, peilKm:0, peilDatum: todayISO(), opmerking:"" });
      bewaar(); render(); break;
    case "bus-wis": if(confirm(`Bus "${S.buses[i].naam}" verwijderen?`)) { S.buses.splice(i,1); bewaar(); render(); } break;
    case "bus-corrigeer": {
      const b = S.buses[i];
      const nu = prompt(`Werkelijke km-stand van ${b.naam}?\n\nDe app rekent nu ${nf(huidigeKm(b.naam))} km.\nVul de stand van de teller in — vanaf vandaag telt de app daar de ritten bij op.`, huidigeKm(b.naam));
      if(nu === null) break;
      /* de ritten die al meegeteld worden trekken we eraf, zodat 'km nu' precies uitkomt op wat je invult */
      b.peilDatum = todayISO();
      b.peilKm = N(nu) - ritKmVanaf(b.naam, b.peilDatum);
      logMut("gecorrigeerd", "km-stand", `${b.naam} → ${nf(N(nu))} km`);
      bewaar(); render(); break; }

    /* kostenposten */
    case "brandstof-nieuw":  brandstofModal({}, true); break;
    case "brandstof-bewerk": brandstofModal(vind(S.brandstof), false); break;
    case "brandstof-wis":    wis(S.brandstof, "brandstof"); break;
    case "schoonmaak-nieuw":  schoonmaakModal({}, true); break;
    case "schoonmaak-bewerk": schoonmaakModal(vind(S.schoonmaak), false); break;
    case "schoonmaak-wis":    wis(S.schoonmaak, "schoonmaak"); break;
    case "onderhoud-nieuw":  onderhoudModal({}, true); break;
    case "onderhoud-bewerk": onderhoudModal(vind(S.onderhoud), false); break;
    case "onderhoud-wis":    wis(S.onderhoud, "onderhoud"); break;
    case "service-nieuw":  serviceModal({}, true); break;
    case "service-bewerk": serviceModal(vind(S.serviceBeurten), false); break;
    case "service-wis":    wis(S.serviceBeurten, "servicebeurt"); break;

    /* verzekering */
    case "verz-nieuw": S.verzekeringen.push({ id:uid("VZ"), bus:(S.buses[0]||{}).naam||"", maatschappij:"",
        verzJaar:0, verzVervalt:"", keurJaar:0, keurVervalt:"" }); bewaar(); render(); break;
    case "verz-wis": if(confirm("Deze regel verwijderen?")) { S.verzekeringen.splice(i,1); bewaar(); render(); } break;

    /* kasboek */
    case "kas-valuta": kasValuta = el.dataset.v; render(); break;
    case "kas-nieuw":  kasModal({}, true); break;
    case "kas-bewerk": kasModal(S.kasboek.entries.find(x=>x.id===id), false); break;
    case "kas-wis":    wis(S.kasboek.entries, "kasregel"); break;

    /* invoices */
    case "inv-nieuw":  invoiceModal({}, true); break;
    case "inv-bewerk": invoiceModal(vind(S.invoices), false); break;
    case "inv-wis":    wis(S.invoices, "invoice"); break;
    case "inv-print":  printId = id; render(); break;
    case "inv-print-sluit": printId = null; render(); break;
    case "inv-print-doen":  window.print(); break;
    case "inv-regel-toevoegen": {
      const box = $("#inv-regels");
      box.insertAdjacentHTML("beforeend", invoiceRegelHtml({oms:"",period:"",bus:1,prijs:0}, box.children.length));
      break; }

    /* gebruikers */
    case "user-nieuw": S.users.push({ id:uid("U"), naam:"Nieuwe gebruiker", gebruikersnaam:"", pincode:"",
        rol:"User", status:"Actief" }); bewaar(); render(); break;
    case "user-wis": if(S.users.length <= 1) { alert("Er moet minstens één gebruiker blijven."); break; }
      if(confirm("Deze gebruiker verwijderen?")) { S.users.splice(i,1); bewaar(); render(); } break;

    /* dagboek */
    case "dagboek-vandaag": dagboekDatum = todayISO(); render(); break;
    case "dagboek-kopieer": {
      const t = $("#dagboek-tekst").value;
      try { await navigator.clipboard.writeText(t); el.textContent = "✓ Gekopieerd"; setTimeout(()=>render(), 1500); }
      catch(err) { prompt("Kopieer deze tekst:", t); }
      break; }

    /* back-up */
    case "backup-download": {
      const blob = new Blob([JSON.stringify(S, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `ttg-backup-${todayISO()}.json`; a.click();
      break; }
    case "backup-csv": {
      const kop = ["Datum","Bus","Bestemming","Klant","Telefoon","Pax","Km","Tarief SRD","Tarief USD","Chauffeur","Status"];
      const regels = S.ritten.slice().sort((a,b)=>a.datum>b.datum?1:-1).map(r =>
        [dmy(r.datum), r.bus, r.bestemming, r.klant, r.telefoon, r.pax, r.km, r.tariefSrd, r.tariefUsd, r.chauffeurPay, r.status]
        .map(v => `"${String(v==null?"":v).replace(/"/g,'""')}"`).join(";"));
      const blob = new Blob(["﻿" + [kop.join(";")].concat(regels).join("\n")], {type:"text/csv"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `ttg-ritten-${todayISO()}.csv`; a.click();
      break; }
  }
});

function herstelBackup(bestand){
  if(!bestand) return;
  if(!confirm("Weet je het zeker? Alle huidige gegevens worden vervangen door de back-up.")) return;
  const lezer = new FileReader();
  lezer.onload = () => {
    try {
      const d = JSON.parse(lezer.result);
      S = (d && d.versie === 4) ? d : migreer(d);
      logMut("teruggezet", "back-up", bestand.name);
      bewaar(); render();
      alert("Back-up teruggezet.");
    } catch(e) { alert("Dit bestand kon ik niet lezen."); }
  };
  lezer.readAsText(bestand);
}

/* ============================================================
   Opstarten
   ============================================================ */
(async function start(){
  if(!token()) { render(); return; }
  try {
    const me = await api("/api/me");
    if(!me.ok) { localStorage.removeItem("ttg-token"); render(); return; }
    const info = await me.json();
    S = await laadState();
    if(!S) { localStorage.removeItem("ttg-token"); render(); return; }
    const eigen = (S.users || []).find(u => u.gebruikersnaam === info.gebruikersnaam);
    USER = eigen || { naam: info.gebruikersnaam, rol: info.rol, gebruikersnaam: info.gebruikersnaam };
    if(MIGRATIE_RAPPORT.length) bewaar();
    render();
  } catch(e) {
    APP().innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:#fff;padding:24px;text-align:center">
      <div><div style="font-size:20px;font-weight:800">De server reageert niet</div>
      <div style="opacity:.8;margin-top:8px">Bij een gratis Render-plan duurt de eerste keer opstarten ongeveer 50 seconden. Wacht even en ververs de pagina.</div>
      <div style="opacity:.5;margin-top:12px;font-size:12px">${esc(e.message)}</div></div></div>`;
  }
})();
</script>
